[package]
name = "sparkles-backup"
description = "Backup repositories for Sparkles databases: incremental, deduplicated backups on a filesystem or S3"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
sparkles-core.workspace = true
object_store = { workspace = true, features = ["tokio"] }
async-trait.workspace = true
percent-encoding.workspace = true
tokio.workspace = true
futures.workspace = true
bytes.workspace = true
sha2.workspace = true
lz4_flex.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
croner.workspace = true
thiserror.workspace = true
tracing.workspace = true
aws-lc-rs = { version = "=1.18.1", optional = true }
argon2 = { version = "=0.6.0", optional = true, features = ["zeroize"] }
zeroize = { version = "=1.9.0", optional = true }
getrandom = { version = "=0.4.3", optional = true }
base64 = { version = "=0.23.1", optional = true }

# statvfs (free space before a restore) and gethostname (lock holders)
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile.workspace = true

[features]
default = ["fs", "s3"]
encryption = ["dep:aws-lc-rs", "dep:argon2", "dep:zeroize", "dep:getrandom", "dep:base64"]
# `fs` repositories (a local or mounted directory)
fs = ["object_store/fs"]
# `s3` repositories (AWS S3 and S3-compatible services: MinIO, Cloudflare R2, Ceph RGW)
s3 = ["object_store/aws"]
# `gcs` and `azure` repositories (experimental, not tested in CI)
gcs = ["object_store/gcp"]
azure = ["object_store/azure"]
