[package]
name = "sparkles-client"
description = "Async and blocking Rust client for Sparkles servers and any SPARQL 1.1 Protocol endpoint"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# declared here rather than from the workspace so that the client does not pull in
# reqwest's own blocking client, which the CLI enables
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream", "multipart"] }
tokio = { version = "1", features = ["rt", "time", "macros", "fs"] }
tokio-util = { version = "0.7", default-features = false, features = ["io"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
bytes.workspace = true
oxrdf.workspace = true
oxrdfio = { workspace = true, features = ["async-tokio"] }
sparesults = { workspace = true, features = ["async-tokio"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
percent-encoding.workspace = true
toml.workspace = true
httpdate = "1"

[dev-dependencies]
axum.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
tempfile.workspace = true

[features]
default = ["blocking"]
# `sparkles_client::blocking`: the same API without async, on a private runtime
blocking = ["tokio/rt-multi-thread"]
# decompress responses the server compresses
gzip = ["reqwest/gzip"]
zstd = ["reqwest/zstd"]
brotli = ["reqwest/brotli"]
