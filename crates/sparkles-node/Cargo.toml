[package]
name = "sparkles-node"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Node-API bindings for Sparkles"
repository = "https://github.com/kclejeune/sparkles"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
napi = { version = "3", default-features = false, features = ["napi9", "tokio_rt"] }
napi-derive = "3"
sparkles = { path = "../sparkles", features = ["zstd", "brotli"] }
sparkles-fmt = { path = "../sparkles-fmt" }
oxrdf = { version = "0.3", features = ["rdfc-10", "rdf-12"] }
oxrdfio = { version = "0.2", features = ["rdf-12"] }
parking_lot = "0.12"
rustc-hash = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sparkles-shacl = { path = "../sparkles-shacl", optional = true }
sparkles-shex = { path = "../sparkles-shex", optional = true }
mimalloc = { version = "0.1.52", optional = true }
sparkles-reasoner = { path = "../sparkles-reasoner", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
uuid = { version = "1", features = ["v4"] }

[build-dependencies]
napi-build = "2"

[features]
default = ["reasoning", "shacl", "shex", "text", "geo", "backup", "graphql"]
reasoning = ["sparkles/reasoning", "dep:sparkles-reasoner"]
shacl = ["sparkles/shacl", "dep:sparkles-shacl"]
shex = ["sparkles/shex", "dep:sparkles-shex"]
text = ["sparkles/text"]
geo = ["sparkles/geo"]
backup = ["sparkles/backup", "sparkles/backup-s3"]
graphql = ["sparkles/graphql"]
# mimalloc as the global allocator of the library's own allocations, as in the server
mimalloc = ["dep:mimalloc"]

[workspace]

[profile.release]
lto = "thin"
codegen-units = 4
panic = "unwind"

# The same debug settings as the root workspace, so builds in the shared target directory
# reuse its compiled dependencies.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

[patch.crates-io]
spargebra = { path = "../../vendor/spargebra" }
