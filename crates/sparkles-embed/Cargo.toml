[package]
name = "sparkles-embed"
description = "Local text embeddings for Sparkles with Candle: sentence-transformers snapshots, BERT-family and Qwen3 encoders, on a dedicated thread pool"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
sparkles-modelstore.workspace = true
# pure-Rust tensors and the BERT-family models; CPU only, no accelerator features. 0.11.1
# shares the pure-Rust tokenizers 0.23 below and requires zip 9 like sparkles-office
candle-core = "0.11.1"
candle-nn = "0.11.1"
candle-transformers = "0.11.1"
# Hugging Face tokenizers with the pure-Rust regex engine: no Oniguruma (C), no C++ suffix
# arrays (esaxx), no HTTP client and no progress bars
tokenizers = { version = "0.23", default-features = false, features = ["fancy-regex"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
rayon.workspace = true
parking_lot.workspace = true

# lowers the nice value of the inference threads
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile.workspace = true
# the HTTP client of the benchmark example's downloads
reqwest.workspace = true
# the server's allocator, so the benchmark's memory figures match a server's
sparkles-alloc.workspace = true

[[example]]
name = "embed-bench"
path = "examples/embed_bench.rs"

# its own main, so the environment is written before any thread exists
[[test]]
name = "candle_threads"
path = "tests/candle_threads.rs"
harness = false
