[package]
name = "sparkles-memory-import"
description = "Deterministic adapters that turn the memory and instruction files of coding agents into facts for Sparkles"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# No server or engine dependency (spec C18 §8.10.4): the command line parses a file on the
# machine that holds it, and only its text and the derived facts travel to the server.
[dependencies]
regex.workspace = true
sha1.workspace = true
sha2.workspace = true
uuid.workspace = true
chrono.workspace = true

[dev-dependencies]
tempfile.workspace = true
