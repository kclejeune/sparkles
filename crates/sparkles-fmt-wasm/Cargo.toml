[package]
name = "sparkles-fmt-wasm"
description = "The Sparkles formatter in the browser: POST /$/format's JSON in and out, without the round trip"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# without `parallel`: no threads in the browser
sparkles-fmt = { path = "../sparkles-fmt", default-features = false }
wasm-bindgen.workspace = true
serde_json.workspace = true

# rand (through spargebra and oxrdf) takes its entropy from the browser's crypto API
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
