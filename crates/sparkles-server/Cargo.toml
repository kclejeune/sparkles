[package]
name = "sparkles-server"
description = "Fuseki-compatible SPARQL server and CLI for the Sparkles RDF database"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "sparkles"
path = "src/main.rs"

[dependencies]
sparkles = { workspace = true, features = ["zstd", "brotli"] }
sparkles-reasoner = { workspace = true, optional = true }
sparkles-shacl = { workspace = true, optional = true }
sparkles-shex = { workspace = true, optional = true }
oxrdf.workspace = true
oxrdfio.workspace = true
spargebra.workspace = true
# `rset`, and the result tables of `rsparql`
sparesults.workspace = true
oxiri.workspace = true
oxilangtag.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
# HTTP/2 next to HTTP/1.1 (negotiated through ALPN over TLS, or with prior knowledge)
axum = { workspace = true, features = ["http2"] }
tower-http.workspace = true
clap = { workspace = true, features = ["env"] }
# `sparkles completions` and `sparkles man`, generated from the clap definition
clap_complete = "4"
clap_mangen = "0.2"
rust-embed.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
parking_lot.workspace = true
tempfile.workspace = true
percent-encoding.workspace = true
flate2.workspace = true
regex.workspace = true
mime_guess = "2"
form_urlencoded = "1"
futures-util = { version = "0.3", default-features = false }
httpdate = "1"
base64 = "0.23"
mimalloc = { version = "0.1.52", optional = true }
libmimalloc-sys = { version = "0.1.49", optional = true, features = ["extended"] }
rayon.workspace = true
ipnet = "2"
arc-swap.workspace = true
chrono.workspace = true
quick_cache = "0.7.0"
http-body = "1"
http-body-util = "0.1"
opentelemetry = { version = "0.33", default-features = false, features = ["trace", "metrics", "logs"], optional = true }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["trace", "metrics", "logs"], optional = true }
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["trace", "metrics", "logs", "grpc-tonic", "http-proto", "reqwest-blocking-client"], optional = true }
opentelemetry-appender-tracing = { version = "0.33", default-features = false, optional = true }
tracing-opentelemetry = { version = "0.34", default-features = false, optional = true }
sha1.workspace = true
uuid.workspace = true
# the UI's Content Security Policy (hashes of inline scripts); API token hashes
sha2.workspace = true
# native TLS (feature `tls`): rustls with the aws-lc-rs provider, already in the tree
# through reqwest
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"], optional = true }
tokio-rustls = { version = "0.26", default-features = false, optional = true }
# authentication (feature `auth`)
subtle = { version = "2.6", optional = true }
getrandom = { version = "0.3", optional = true }
argon2 = { version = "0.6", optional = true }
toml = { version = "1", optional = true }
zeroize = { version = "1", optional = true }
jsonwebtoken = { version = "11", default-features = false, features = ["aws_lc_rs"], optional = true }
reqwest = { workspace = true, optional = true }
# `sparkles memory`: the harness adapters, and tower's `oneshot` for `--loc`; the MCP
# server uses their redaction patterns for the `secret-detected` check of `register_source`
sparkles-memory-import = { workspace = true, optional = true }
tower = { version = "0.5", features = ["util"], optional = true }
rpassword = { version = "7", optional = true }
# the credentials file of `sparkles auth login`, shared with the Rust client
sparkles-client = { workspace = true, optional = true }
# MCP server (`sparkles mcp` on stdio, `serve --mcp` at `/$/mcp`): the official Rust SDK,
# without its tool macros
rmcp = { version = "~3.5", default-features = false, features = ["server", "transport-io", "transport-streamable-http-server"], optional = true }
# shuts down the SSE streams of `/$/mcp` with the server (already in the tree through rmcp)
tokio-util = { version = "0.7", default-features = false, optional = true }
# backup repositories (feature `backup`)
sparkles-backup = { workspace = true, optional = true }
# the formatter (feature `fmt`): `sparkles fmt` walks directories with gitignore rules and
# prints unified diffs
sparkles-fmt = { workspace = true, optional = true }
ignore = { workspace = true, optional = true }
similar = { workspace = true, optional = true }
# the GraphQL endpoint (feature `graphql`): `/{ds}/graphql`, `sparkles graphql`
sparkles-graphql = { workspace = true, optional = true }
# `sparkles lsp` (feature `fmt`): formatting and syntax diagnostics for editors over stdio
lsp-server = { workspace = true, optional = true }
lsp-types = { workspace = true, optional = true }
# PDF conversion for ingestion (feature `pdf`, spec C18 §7.1.1): an exact pin, because a
# new version can change the Markdown and with it the offsets of stored renditions
pdf-inspector = { version = "=1.25.2", default-features = false, optional = true }
# the model store (spec F12): `sparkles models` and `serve --models-dir`; local embedding
# models with Candle under the feature `embed-local`
sparkles-modelstore.workspace = true
sparkles-embed = { workspace = true, optional = true }

# malloc_trim (glibc), and statvfs for the free-space guard of spooled request bodies
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
sparkles = { workspace = true, features = ["failpoints"] }
tower = { version = "0.5", features = ["util"] }
# HTTPS clients of the native TLS tests (HTTP/1.1 and HTTP/2)
reqwest = { workspace = true, features = ["http2"] }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["trace", "metrics", "logs", "testing"] }
# signs the ID tokens of the mock OIDC provider in tests (already in the tree via rustls)
aws-lc-rs = "1"
# the formatter's test-only fault switch (`SPARKLES_FMT_FAULT`), so the tests can show that
# `sparkles fmt` and `POST /$/format` refuse output that fails the safety checks
sparkles-fmt = { workspace = true, features = ["fault-injection"] }
# the Rust client, tested against this crate's binary (tests/rust_client.rs)
sparkles-client = { workspace = true, features = ["blocking"] }

[features]
default = ["reasoning", "shacl", "shex", "mimalloc", "text", "geo", "geo-epsg", "otel", "auth", "mcp", "memory", "backup", "fmt", "tls", "graphql", "pdf"]
# RDFS / OWL RL / Jena-rules materialization (`/$/reason`, `sparkles infer`)
reasoning = ["dep:sparkles-reasoner", "sparkles/reasoning"]
# SHACL validation (`/{ds}/shacl`, `sparkles shacl`)
shacl = ["dep:sparkles-shacl", "sparkles/shacl"]
# ShEx validation (`/{ds}/shex`, `sparkles shex`)
shex = ["dep:sparkles-shex", "sparkles/shex"]
# full-text search (`text:query`, `/$/text`, `sparkles text-index`)
text = ["sparkles/text"]
# GeoSPARQL (`geof:` functions, `spatial:` property functions, `/$/geo`, `sparkles geo-index`),
# with projected CRSs an operator defines by proj4 strings (`--geo-crs`)
geo = ["sparkles/geo", "sparkles/geo-proj4"]
# GeoSPARQL: resolve EPSG codes through the EPSG-derived proj4 table of crs-definitions.
# On by default; the binary then carries EPSG-derived data under the EPSG terms of use
# (see THIRD_PARTY_LICENSES.md)
geo-epsg = ["geo", "sparkles/geo-epsg"]
# authentication and dataset-level authorization (`serve --auth-config`, `sparkles auth`)
auth = [
    "dep:subtle",
    "dep:getrandom",
    "dep:argon2",
    "dep:toml",
    "dep:zeroize",
    "dep:rpassword",
    "dep:jsonwebtoken",
    "dep:reqwest",
    "dep:sparkles-client",
]
# native TLS: `serve --tls-cert FILE --tls-key FILE`
tls = ["dep:rustls", "dep:tokio-rustls"]
# Model Context Protocol server for LLM agents (`sparkles mcp` on stdio, `serve --mcp`)
mcp = ["dep:rmcp", "dep:tokio-util", "dep:sparkles-memory-import"]
# `sparkles memory`: import coding agents' memory and instruction files, sync them, and
# print the brief (C18 §10.1); `--loc` serves the database in the process
memory = ["mcp", "auth", "dep:sparkles-memory-import", "dep:tower"]
# PDF conversion in ingestion (`POST /$/ingest/{ds}`, `sparkles ingest`) with pdf-inspector;
# without it a PDF is refused with `unsupported-format` (spec C18 §7.1.1)
pdf = ["mcp", "dep:pdf-inspector"]
# OCR of scanned PDF pages: PDFium and ONNX Runtime loaded at run time from paths the
# operator gives, with the PP-OCR models from a directory (`serve --pdf-ocr-models`); never
# downloads a model. Off by default and not part of release builds. pdf-inspector's OCR
# fusion compiles only under its `ocr` feature, which also builds its model downloader;
# conversion sets the offline policy, so the downloader is never used
pdf-ocr = ["pdf", "pdf-inspector/ocr"]
# local embedding models run in the process with Candle (spec F12): the `local` provider
# kind of the model configuration. Off by default; without it an index that uses a local
# provider fails with a clear error, and `sparkles models` still manages the store
embed-local = ["dep:sparkles-embed"]
# backup repositories on a filesystem or S3: `/$/repositories`, `/$/backups/{ds}`,
# `/$/backup-policies`, `sparkles repo …`, `sparkles backup create|list|restore|…`
backup = ["dep:sparkles-backup", "dep:toml", "sparkles/backup"]
backup-encryption = ["backup", "sparkles/backup-encryption", "sparkles-backup/encryption"]
# the formatter: `sparkles fmt`, `sparkles lsp` and `POST /$/format`
fmt = [
    "sparkles/fmt",
    "dep:sparkles-fmt",
    "dep:ignore",
    "dep:similar",
    "dep:toml",
    "dep:lsp-server",
    "dep:lsp-types",
]
# the read-only GraphQL adapter: `/{ds}/graphql`, `/$/graphql/{ds}`, `sparkles graphql`
graphql = ["dep:sparkles-graphql", "sparkles/graphql"]
# mimalloc as the global allocator (faster joins than glibc malloc under concurrency);
# without it, glibc's malloc_trim releases idle heap memory instead
mimalloc = ["dep:mimalloc", "dep:libmimalloc-sys"]
# OpenTelemetry: OTLP traces, metrics and logs (`serve --otel`, `OTEL_*`; off at run time
# unless enabled)
otel = [
  "dep:opentelemetry",
  "dep:opentelemetry_sdk",
  "dep:opentelemetry-otlp",
  "dep:opentelemetry-appender-tracing",
  "dep:tracing-opentelemetry",
]
