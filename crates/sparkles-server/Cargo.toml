[package]
name = "sparkles-server"
description = "Fuseki-compatible SPARQL server and CLI for the Sparkles RDF database"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "sparkles"
path = "src/main.rs"

[dependencies]
sparkles = { workspace = true, features = ["zstd", "brotli"] }
sparkles-reasoner = { workspace = true, optional = true }
sparkles-shacl = { workspace = true, optional = true }
oxrdf.workspace = true
oxrdfio.workspace = true
spargebra.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
axum.workspace = true
tower-http.workspace = true
clap = { workspace = true, features = ["env"] }
rust-embed.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
parking_lot.workspace = true
tempfile.workspace = true
percent-encoding.workspace = true
flate2.workspace = true
regex.workspace = true
mime_guess = "2"
form_urlencoded = "1"
futures-util = { version = "0.3", default-features = false }
httpdate = "1"
base64 = "0.23"
mimalloc = { version = "0.1.52", optional = true }
libmimalloc-sys = { version = "0.1.49", optional = true, features = ["extended"] }
rayon.workspace = true
ipnet = "2"
arc-swap.workspace = true
chrono.workspace = true
quick_cache = "0.7.0"
http-body = "1"
http-body-util = "0.1"
opentelemetry = { version = "0.33", default-features = false, features = ["trace", "metrics", "logs"], optional = true }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["trace", "metrics", "logs"], optional = true }
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["trace", "metrics", "logs", "grpc-tonic", "http-proto", "reqwest-blocking-client"], optional = true }
opentelemetry-appender-tracing = { version = "0.33", default-features = false, optional = true }
tracing-opentelemetry = { version = "0.34", default-features = false, optional = true }
uuid = { workspace = true, optional = true }
# authentication (feature `auth`)
sha2 = { workspace = true, optional = true }
subtle = { version = "2.6", optional = true }
getrandom = { version = "0.3", optional = true }
argon2 = { version = "0.6", optional = true }
toml = { version = "1", optional = true }
zeroize = { version = "1", optional = true }
jsonwebtoken = { version = "11", default-features = false, features = ["aws_lc_rs"], optional = true }
reqwest = { workspace = true, optional = true }
rpassword = { version = "7", optional = true }
# MCP server (`sparkles mcp`): the official Rust SDK, without its tool macros
rmcp = { version = "~3.5", default-features = false, features = ["server", "transport-io"], optional = true }

# malloc_trim (glibc), and statvfs for the free-space guard of spooled request bodies
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["trace", "metrics", "logs", "testing"] }
# signs the ID tokens of the mock OIDC provider in tests (already in the tree via rustls)
aws-lc-rs = "1"

[features]
default = ["reasoning", "shacl", "mimalloc", "text", "otel", "auth", "mcp"]
# RDFS / OWL RL / Jena-rules materialization (`/$/reason`, `sparkles infer`)
reasoning = ["dep:sparkles-reasoner"]
# SHACL validation (`/{ds}/shacl`, `sparkles shacl`)
shacl = ["dep:sparkles-shacl"]
# full-text search (`text:query`, `/$/text`, `sparkles text-index`)
text = ["sparkles/text"]
# authentication and dataset-level authorization (`serve --auth-config`, `sparkles auth`)
auth = [
    "dep:sha2",
    "dep:subtle",
    "dep:getrandom",
    "dep:argon2",
    "dep:toml",
    "dep:zeroize",
    "dep:rpassword",
    "dep:jsonwebtoken",
    "dep:reqwest",
]
# Model Context Protocol server for LLM agents (`sparkles mcp`, stdio)
mcp = ["dep:rmcp"]
# mimalloc as the global allocator (faster joins than glibc malloc under concurrency);
# without it, glibc's malloc_trim releases idle heap memory instead
mimalloc = ["dep:mimalloc", "dep:libmimalloc-sys"]
# OpenTelemetry: OTLP traces, metrics and logs (`serve --otel`, `OTEL_*`; off at run time
# unless enabled)
otel = [
  "dep:opentelemetry",
  "dep:opentelemetry_sdk",
  "dep:opentelemetry-otlp",
  "dep:opentelemetry-appender-tracing",
  "dep:tracing-opentelemetry",
  "dep:uuid",
]
