[package]
name = "sparkles-server"
description = "Fuseki-compatible SPARQL server and CLI for the Sparkles RDF database"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "sparkles"
path = "src/main.rs"

[dependencies]
sparkles.workspace = true
sparkles-reasoner = { workspace = true, optional = true }
oxrdf.workspace = true
oxrdfio.workspace = true
spargebra.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
axum.workspace = true
tower-http.workspace = true
clap.workspace = true
rust-embed.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
parking_lot.workspace = true
tempfile.workspace = true
percent-encoding.workspace = true
flate2.workspace = true
regex.workspace = true
mime_guess = "2"
form_urlencoded = "1"

[features]
default = ["reasoning"]
# RDFS / OWL RL / Jena-rules materialization (`/$/reason`, `sparkles infer`)
reasoning = ["dep:sparkles-reasoner"]
