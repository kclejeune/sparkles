# cargo-nextest settings for `mise run test`. Each test runs in its own process, and test
# binaries run in parallel, where `cargo test` runs them one after another.

[profile.default]
# Report every failure, then list them again in the final summary.
failure-output = "immediate-final"
success-output = "never"
status-level = "slow"
final-status-level = "slow"
fail-fast = false
# A test that runs longer than two minutes is reported as slow, and one that runs past
# ten minutes is stopped and counted as failed instead of hanging the run.
slow-timeout = { period = "120s", terminate-after = 5 }

# The test task reads this report to warn about tests slow enough to time out on
# GitHub's runners (scripts/nextest-slow.py).
[profile.default.junit]
path = "junit.xml"

[profile.ci]
failure-output = "immediate-final"
success-output = "never"
status-level = "slow"
final-status-level = "slow"
fail-fast = false
slow-timeout = { period = "120s", terminate-after = 5 }

[profile.ci.junit]
path = "junit.xml"

# Tests whose outcome depends on how long a run takes, such as whether planning stops
# soon after its timeout. They run one at a time and alone, with no other test on the
# machine, since other work stretches the time a stop takes. CI runs them in a job of
# their own and leaves them out of the test shards (.github/workflows/ci.yml), so a new
# test here needs the same filter there.
[test-groups.timing]
max-threads = 1

[[profile.default.overrides]]
filter = "test(planning_at_the_limit_stops_at_the_timeout)"
test-group = "timing"
threads-required = "num-cpus"
slow-timeout = { period = "300s", terminate-after = 4 }

# This functional test imports a 5 MiB transcript through real HTTP requests. Give
# it the runner's test slots so concurrent heavy tests do not consume its server's
# query deadline. Keep the production timeout and all assertions unchanged.
[[profile.default.overrides]]
filter = "binary(cli_memory) & test(memory_transcripts_review_and_export)"
threads-required = "num-test-threads"

# This test gives the producer 150 ms of active time while its slow reader takes
# longer. Other tests can consume that budget between writes or before the blocking
# task starts. Keep its deadline and assertions, and give it the runner's test slots.
[[profile.default.overrides]]
filter = "test(controlled_waits_do_not_count_against_the_deadline)"
threads-required = "num-test-threads"
