# cargo-nextest settings for `mise run test`. Each test runs in its own process, and test
# binaries run in parallel, where `cargo test` runs them one after another.

[profile.default]
# Report every failure, then list them again in the final summary.
failure-output = "immediate-final"
success-output = "never"
status-level = "slow"
final-status-level = "slow"
fail-fast = false
# A test that runs longer than two minutes is reported as slow, and one that runs past
# ten minutes is stopped and counted as failed instead of hanging the run.
slow-timeout = { period = "120s", terminate-after = 5 }

# The test task reads this report to warn about tests slow enough to time out on
# GitHub's runners (scripts/nextest-slow.py).
[profile.default.junit]
path = "junit.xml"

[profile.ci]
failure-output = "immediate-final"
success-output = "never"
status-level = "slow"
final-status-level = "slow"
fail-fast = false
slow-timeout = { period = "120s", terminate-after = 5 }

[profile.ci.junit]
path = "junit.xml"

# Tests whose outcome depends on how long a run takes, such as whether planning stops
# soon after its timeout. They run one at a time and alone, with no other test on the
# machine, since other work stretches the time a stop takes. CI runs them in a job of
# their own and leaves them out of the test shards (.github/workflows/ci.yml), so a new
# test here needs the same filter there, in TIMING, and its binary in TIMING_BINARIES.
[test-groups.timing]
max-threads = 1

[[profile.default.overrides]]
filter = "test(planning_at_the_limit_stops_at_the_timeout)"
test-group = "timing"
threads-required = "num-cpus"
slow-timeout = { period = "300s", terminate-after = 4 }

# The JSON-LD lint must stop soon after a 25 ms deadline on a 7 MiB document. On a
# loaded runner the passes between two deadline checks take longer than the slack.
[[profile.default.overrides]]
filter = "test(a_large_json_ld_document_keeps_to_a_short_deadline)"
test-group = "timing"
threads-required = "num-cpus"

# This functional test imports a 5 MiB transcript through real HTTP requests. Give
# it the runner's test slots so concurrent heavy tests do not consume its server's
# query deadline. Keep the production timeout and all assertions unchanged.
[[profile.default.overrides]]
filter = "binary(cli_memory) & test(memory_transcripts_review_and_export)"
threads-required = "num-test-threads"

# This test gives the producer 150 ms of active time while its slow reader takes
# longer. Other tests can consume that budget between writes or before the blocking
# task starts. Keep its deadline and assertions, and give it the runner's test slots.
[[profile.default.overrides]]
filter = "test(controlled_waits_do_not_count_against_the_deadline)"
threads-required = "num-test-threads"

# Known flaky tests, and only these, get retries. Each has a roadmap item to make it
# deterministic, and the entry goes once that item ships. A retry prints a TRY line as it
# happens, the final summary lists the test as FLAKY, and `mise run test` writes the tests
# that passed only on a retry to .artifacts/ci/flaky-tests.txt, which scripts/ci.sh repeats
# in its summary. A test that fails every attempt still fails the run.
#
# a_build_can_be_held_to_a_write_rate times a rate-limited compaction against the wall
# clock, and a loaded host can stretch or shorten its sleeps (item NEW-ITEM-2).
[[profile.default.overrides]]
filter = "package(sparkles-core) & test(=store::compaction_tests::a_build_can_be_held_to_a_write_rate)"
retries = 2

# The slowest tests start first, so a shard does not end with one of them running alone
# after the short tests have finished. The list comes from CI's JUnit timings and only
# changes the order, so a renamed test merely loses its head start.
[[profile.default.overrides]]
filter = """test(/^(\
crash_images_during_background_full_text_checkpoints_(ordinary|grouped)|\
sparql::join_tests::galloping_index_joins_match_scans_per_cluster_across_blocks|\
a_heavy_key_joins_as_a_block_nested_loop|\
every_inferred_triple_has_a_sound_demand_tree|\
spilled_hash_joins_match_eager_at_every_batch_size|\
spilled_optional_and_minus_handle_unbound_keys|\
sparql::cursor::joinspill::tests::spilled_distinct_of_colliding_rows_is_not_amplified|\
comment_sweeps|\
sparql::cursor::joinspill::tests::spilled_join_modes_match_eager_execution|\
crash_images_of_a_dataset_with_full_text_search_(grouped|ordinary)|\
random_joins_and_nearest_neighbours_agree|\
demand_answers_like_materialization|\
sparql_query_cursors_[123]_rows?|\
sparql_query_with_an_unused_registry_(eager|cursor)|\
sparql::opt_tests::the_numeric_column_answers_as_decoding_does|\
morsel_filters_and_ordered_top_k_agree_with_eager_on_mixed_terms|\
memory_stays_bounded|\
ordered_top_k_dedups_union_graph_rows_across_morsels|\
sparql::join_tests::flat_hash_joins_give_the_rows_of_per_key_lists_in_the_same_order|\
every_syntax_and_codec_agree_in_all_parse_modes|\
exists_evaluated_per_key_stays_eager_and_matches|\
f16_keeping_after_commit_stays_within_limit|\
sparql::opt_tests::range_filters_read_only_matching_id_ranges|\
schema_heavy_demand_answers_like_materialization|\
incremental::tests::owl_rl_matches_full|\
ask_over_a_large_keyed_join_reads_both_sides_alternately|\
http::pool_tests::dropping_a_default_streamed_body_releases_its_query_grant\
)$/)"""
priority = 50
