# Git hooks, run by prek (https://github.com/j178/prek) or pre-commit on staged files.
#   mise run hooks:install   # install the pre-commit hook (prek install)
#   mise run hooks:run       # run every hook over all tracked files
# Tools come from mise.toml (prek, shfmt, shellcheck, node), rust-toolchain.toml (rustfmt),
# ui/package.json (oxfmt; needs `mise run ui:install`) and the flake (`nix fmt` = nixfmt).
repos:
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        # formats the whole workspace and the Python, JVM and Node bindings' crates,
        # which are their own workspaces; vendor/ is outside all of them
        entry: sh -c 'cargo fmt --all && cargo fmt --manifest-path crates/sparkles-py/Cargo.toml && cargo fmt --manifest-path crates/sparkles-ffi/Cargo.toml && cargo fmt --manifest-path crates/sparkles-node/Cargo.toml'
        language: system
        types: [rust]
        exclude: ^vendor/
        pass_filenames: false

      - id: oxfmt
        name: oxfmt (ui)
        # oxfmt runs from ui/node_modules so it can load the project's Svelte compiler;
        # ui/.oxfmtrc.json applies to files under ui/ and ignores pnpm-lock.yaml
        entry: mise x -- ui/node_modules/.bin/oxfmt --no-error-on-unmatched-pattern
        language: system
        files: ^ui/.*\.(js|mjs|cjs|ts|mts|cts|jsx|tsx|svelte|json|jsonc|json5|css|scss|less|html|vue|md|mdx|ya?ml|toml|graphql)$

      - id: oxfmt-js
        name: oxfmt (JavaScript packages)
        entry: mise run node:fmt
        language: system
        files: ^js/.*\.(js|mjs|cjs|ts|mts|cts|json|jsonc|md|ya?ml)$
        pass_filenames: false

      - id: nixfmt
        name: nixfmt
        # the flake's `formatter` (pkgs.nixfmt), pinned by flake.lock
        entry: nix fmt --
        language: system
        types: [nix]

      - id: shfmt
        name: shfmt
        entry: mise x -- shfmt --write --indent 2 --case-indent --space-redirects
        language: system
        types: [shell]
        exclude_types: [zsh]
        # the Gradle wrapper script is generated by `gradle wrapper`
        exclude: ^jvm/gradlew$

      - id: shellcheck
        name: shellcheck
        entry: mise x -- shellcheck
        language: system
        types: [shell]
        exclude_types: [zsh]
        exclude: ^jvm/gradlew$
