# Development tools and tasks. `mise tasks` lists everything; `mise run <task>`.
# Rust itself is pinned by rust-toolchain.toml (rustup), not here.

[tools]
node = "24"
pnpm = "10.34.5"
hyperfine = "1.20"
# Git hooks (.pre-commit-config.yaml) and the shell formatter and linter they run
# (shellcheck is GPL-3.0; a development tool only, not linked into Sparkles). The UI formatter
# (oxfmt) is a devDependency in ui/package.json so it can load the project's Svelte compiler;
# nixfmt comes from the flake (`nix fmt`).
prek = "0.5.4"
shfmt = "3.14.1"
shellcheck = "0.11.0"
# The JVM bindings (jvm/): the library builds with a Java 17 toolchain, and Java 21 runs Jena
# 6 and Fuseki 6. Gradle runs through the checked-in wrapper (jvm/gradlew); this Gradle is the
# version the wrapper and nixpkgs' gradle_9 pin, for `gradle wrapper` and the Nix lock file.
java = ["temurin-17.0.20+8", "temurin-21.0.12+8.0.LTS"]
gradle = "9.7.1"
# Runs the Rust tests (`mise run test`), with test binaries in parallel and a summary of
# every failure at the end
"github:nextest-rs/nextest" = { version = "0.9.146", version_prefix = "cargo-nextest-" }

# ---------------------------------------------------------------------- task caching ----
# The check tasks of `ci` declare their inputs as `sources` and write no files
# (`outputs = []`), so mise's task cache records each success under a key built from the
# contents of those files, the task's definition, the resolved tools and the values below.
# A check whose inputs have not changed since it last passed is skipped and its log
# replayed, also in another checkout or worktree with the same files. Failures are never
# cached. `mise run --force <task>` or `MISE_TASK_CACHE=off` runs a check regardless, and
# `mise run --dry-run --task-cache-explain <task>` lists a key's inputs.

[settings]
# the task cache is experimental in mise
experimental = true

[task_config]
# Rust follows the stable channel (rust-toolchain.toml), so the compiler's version is part
# of every key. These variables change what the checks see, so they are part of it too.
cache = { enabled = true, command_inputs = ["rustc -V"] }
global_env = ["RUSTFLAGS", "CARGO_FEATURES", "SPARKLES_W3C_DIR", "SPARKLES_SHACL_TESTS", "SPARKLES_SHEX_TESTS"]

[task_config.input_groups]
# Everything the Rust workspaces compile or read in their tests, listed by directory so the
# globs do not walk the binding crates' own target directories.
rust = [
  "Cargo.toml",
  "Cargo.lock",
  "rust-toolchain.toml",
  ".config/nextest.toml",
  "crates/*/*.toml",
  "crates/*/Cargo.lock",
  "crates/*/build.rs",
  "crates/*/src/**",
  "crates/*/tests/**",
  "crates/*/examples/**",
  "crates/*/benches/**",
  "crates/*/diagnostics/**",
  "crates/*/rules/**",
  "crates/*/vocab/**",
  "crates/*/fuzz/**",
  "crates/*/python/**",
  "vendor/**",
]
# The UI's sources; the server embeds its build.
ui = [
  "ui/package.json",
  "ui/pnpm-lock.yaml",
  "ui/*.ts",
  "ui/*.js",
  "ui/tsconfig.json",
  "ui/.oxfmtrc.json",
  "ui/src/**",
  "ui/static/**",
  "ui/tests/**",
  "ui/mock/**",
  "ui/scripts/**",
]
js = [
  "js/package.json",
  "js/pnpm-lock.yaml",
  "js/pnpm-workspace.yaml",
  "js/tsconfig.json",
  "js/.oxfmtrc.json",
  "js/scripts/**",
  "js/*/package.json",
  "js/*/tsconfig.json",
  "js/*/src/**",
  "js/*/test/**",
  "js/engine/npm/**",
]
jvm = [
  "jvm/*.kts",
  "jvm/*.properties",
  "jvm/*.lockfile",
  "jvm/gradle/**",
  "jvm/*/build.gradle.kts",
  "jvm/*/gradle.lockfile",
  "jvm/*/src/**",
  "jvm/*/testing/**",
]
# The documents that tests and the doc-path check read. docs/plans is left out.
docs = ["README.md", "docs/*.md", "docs/*.json", "docs/specs/**"]

# ------------------------------------------------------------------------------ UI ----

[tasks."ui:install"]
description = "Install UI dependencies"
dir = "ui"
run = "pnpm install --frozen-lockfile"
sources = ["package.json", "pnpm-lock.yaml"]
outputs = ["node_modules/.modules.yaml"]
# The output above marks a finished run; the task writes more than it, so the task
# cache, which restores only declared outputs, stays off.
cache = { enabled = false }

[tasks."ui:wasm"]
description = "Build the formatter for the browser into ui/src/lib/wasm (optional: the UI uses it when present, else POST /$/format; later UI builds keep it up to date)"
# the wasm-bindgen CLI must be the version of the wasm-bindgen crate in Cargo.lock
tools = { "github:wasm-bindgen/wasm-bindgen" = "0.2.129" }
run = "scripts/build-fmt-wasm.sh"
sources = ["crates/sparkles-fmt/src/**/*", "crates/sparkles-fmt/Cargo.toml", "crates/sparkles-fmt-wasm/**/*", "Cargo.lock", "rust-toolchain.toml", "scripts/build-fmt-wasm.sh"]
outputs = ["ui/src/lib/wasm/sparkles_fmt_wasm_bg.wasm"]
# The output above marks a finished run; the task writes more than it, so the task
# cache, which restores only declared outputs, stays off.
cache = { enabled = false }

[tasks."ui:wasm:refresh"]
description = "Rebuild the browser formatter if it was built before (`mise run ui:wasm`) and the formatter changed since"
hide = true
run = "if [ -e ui/src/lib/wasm/sparkles_fmt_wasm_bg.wasm ]; then mise run ui:wasm; fi"

[tasks."ui:build"]
description = "Build the SvelteKit UI (embedded into the server binary)"
depends = ["ui:install", "ui:wasm:refresh"]
dir = "ui"
run = "pnpm build"
sources = ["src/**/*", "static/**/*", "scripts/**/*", "svelte.config.js", "vite.config.ts", "package.json", "pnpm-lock.yaml"]
# not index.html: the server build writes a placeholder one when the UI is missing
outputs = ["build/_app/version.json"]
# The output above marks a finished run; the task writes more than it, so the task
# cache, which restores only declared outputs, stays off.
cache = { enabled = false }

[tasks."ui:dev"]
description = "UI dev server (proxies the API to $SPARKLES_API, default http://localhost:3030)"
depends = ["ui:install"]
dir = "ui"
run = "pnpm dev"

[tasks."ui:mock"]
description = "Mock API server for UI development without the Rust backend"
depends = ["ui:install"]
dir = "ui"
run = "pnpm mock"

[tasks."ui:check"]
sources = ["@group:ui"]
outputs = []
description = "Type-check the UI (svelte-check)"
# after ui:build: both regenerate ui/.svelte-kit, and running them at once races
depends = ["ui:install", "ui:build"]
dir = "ui"
run = "pnpm check"

[tasks."ui:test"]
sources = ["@group:ui"]
outputs = []
description = "UI unit tests (Vitest)"
depends = ["ui:install", "ui:build"]
dir = "ui"
run = "pnpm test"

[tasks."ui:e2e:browsers"]
description = "Chromium for the UI end-to-end tests: the flake's (`nix develop`) or a Playwright download"
depends = ["ui:install"]
dir = "ui"
run = '''
if [ -n "${PLAYWRIGHT_BROWSERS_PATH:-}" ]; then exit 0; fi
if [ -e /etc/NIXOS ]; then
  echo "Playwright's browser downloads do not run on NixOS: use 'nix develop -c mise run ui:e2e'" >&2
  exit 1
fi
pnpm exec playwright install chromium
'''

[tasks."ui:e2e"]
description = "UI end-to-end tests (Playwright) against a real `sparkles serve` (debug build; SPARKLES_BIN=… for another); extra args go to `playwright test`"
depends = ["ui:build", "ui:e2e:browsers"]
dir = "ui"
run = '''
[ -n "${SPARKLES_BIN:-}" ] || cargo build -p sparkles-server
pnpm e2e
'''

[tasks."ui:e2e:mock"]
description = "UI end-to-end tests (Playwright) against the mock backend, for pages and states that are hard to reach on a real server; extra args go to `playwright test`"
depends = ["ui:e2e:browsers"]
dir = "ui"
run = "pnpm e2e:mock"

[tasks."ui:fmt"]
description = "Format the UI (oxfmt)"
depends = ["ui:install"]
dir = "ui"
run = "pnpm format"

[tasks."ui:fmt:check"]
sources = ["@group:ui"]
outputs = []
description = "Check UI formatting (oxfmt)"
depends = ["ui:install"]
dir = "ui"
run = "pnpm format:check"

# ------------------------------------------------------------------------- git hooks ----

[tasks."hooks:install"]
description = "Install the pre-commit hook (prek; see .pre-commit-config.yaml)"
depends = ["ui:install"]
run = "prek install"

[tasks."hooks:run"]
description = "Run every pre-commit hook over all tracked files"
depends = ["ui:install"]
run = "prek run --all-files"

# ----------------------------------------------------------------- format / lint / test ----

[tasks.fmt]
description = "Format Rust and UI code"
depends = ["ui:fmt", "node:fmt"]
# Language-binding crates are their own workspaces, outside `--all`
run = [
  "cargo fmt --all",
  "cargo fmt --manifest-path crates/sparkles-py/Cargo.toml",
  "cargo fmt --manifest-path crates/sparkles-ffi/Cargo.toml",
  "cargo fmt --manifest-path crates/sparkles-node/Cargo.toml",
]

[tasks."fmt:check"]
sources = ["@group:rust"]
outputs = []
description = "Check formatting (CI)"
depends = ["ui:fmt:check", "node:fmt:check"]
run = [
  "cargo fmt --all --check",
  "cargo fmt --manifest-path crates/sparkles-py/Cargo.toml --check",
  "cargo fmt --manifest-path crates/sparkles-ffi/Cargo.toml --check",
  "cargo fmt --manifest-path crates/sparkles-node/Cargo.toml --check",
]

[tasks."fmt:jsonld-compare"]
description = "Compare the JSON-LD formatter's golden outputs with oxfmt (Prettier's JSON conventions) and show the differences; not part of ci"
depends = ["ui:install"]
usage = '''
flag "--strict" help="exit 1 when an output differs"
'''
run = 'scripts/fmt-jsonld-prettier.sh ${usage_strict:+--strict}'

[tasks."fmt:fuzz"]
description = "Fuzz the formatter with cargo-fuzz (needs a nightly toolchain and cargo-fuzz; see crates/sparkles-fmt/fuzz/README.md); not part of ci"
usage = '''
arg "[target]..." help="fmt_sparql, fmt_turtle, fmt_lines or fmt_jsonld (default: all four)" var=#true
flag "--time <seconds>" help="seconds per target" default="1800"
flag "--jobs <n>" help="fuzzing processes per target" default="2"
'''
run = 'crates/sparkles-fmt/fuzz/run.sh --time "$usage_time" --jobs "$usage_jobs" ${usage_target:-}'

[tasks."fmt:wasm"]
sources = ["@group:rust"]
outputs = []
description = "Check that the formatter builds for the browser (wasm32-unknown-unknown, which rust-toolchain.toml installs), with Clippy"
run = "cargo clippy -p sparkles-fmt-wasm --target wasm32-unknown-unknown -- -D warnings"

[tasks.lint]
sources = ["@group:rust", "@group:ui"]
outputs = []
description = "Clippy (warnings are errors) + svelte-check"
# ui:build first: the server embeds ui/build, which a concurrent UI build rewrites
depends = ["ui:check", "ui:build"]
run = "cargo clippy --workspace --all-targets -- -D warnings"

[tasks."lint:features"]
sources = ["@group:rust", "@group:ui", "scripts/lint-features.sh"]
outputs = []
description = "Clippy (warnings are errors) over feature combinations: the server with no optional feature, each default feature alone (geo-epsg included), and the pairs that share code such as mcp with shacl, shex or fmt and graphql with shacl; the library crates with their features off"
# ui:build first, as for lint: the server embeds ui/build
depends = ["ui:build"]
run = "scripts/lint-features.sh"

[tasks."lint:doc-paths"]
sources = ["@group:rust", "@group:docs", "scripts/check-doc-paths.py"]
outputs = []
description = "Check that every crates/sparkles… path cited in the README, docs/*.md, docs/specs and the Rust comments exists"
run = "python3 scripts/check-doc-paths.py --code"

[tasks.check]
description = "Fast compile check of all crates and targets + UI type check"
depends = ["ui:check", "ui:build"]
run = "cargo check --workspace --all-targets"

[tasks.test]
sources = ["@group:rust", "@group:ui", "@group:docs", "testsuite/**"]
outputs = []
# The W3C, SHACL, ShEx and JSON-LD suites read checkouts of Apache Jena and Oxigraph
# next to this repository when they exist, so their commits are part of the key.
cache = { enabled = true, command_inputs = [
  "rustc -V",
  "git -C ../../apache/jena rev-parse HEAD 2> /dev/null || echo absent",
  "git -C ../../oxigraph/oxigraph rev-parse HEAD 2> /dev/null || echo absent",
] }
description = "All Rust tests with cargo-nextest (unit, W3C SPARQL + SHACL suites when the Jena checkout is present), then the doctests"
depends = ["ui:build"]
# nextest does not run doctests, so `cargo test --doc` runs them afterwards
run = [
  "cargo nextest run --workspace --no-fail-fast",
  "cargo test --workspace --doc",
]

[tasks."test:cargo"]
description = "All Rust tests with plain `cargo test`, one test binary after another"
depends = ["ui:build"]
run = "cargo test --workspace"

[tasks."test:w3c"]
description = "W3C SPARQL 1.0/1.1/1.2 conformance with per-suite summaries"
run = "cargo test -p sparkles-core --test w3c -- --nocapture --test-threads=1"

[tasks."test:shacl"]
description = "W3C SHACL Core + SHACL-SPARQL conformance, the SHACL 1.2 list tests and the SHACLC test pairs"
run = "cargo test -p sparkles-shacl --test w3c_shacl -- --nocapture"

[tasks."test:shex"]
description = "shexTest conformance (syntax, negative syntax and structure, representation, validation)"
run = "cargo test -p sparkles-shex --test shextest -- --nocapture"

[tasks."test:jena-clients"]
description = "Apache Jena's own HTTP clients (RDFConnectionRemote, RDFConnectionFuseki, GSP, DSP, QueryExecHTTP, UpdateExecHTTP) and Fuseki admin calls against a debug server on a temporary directory; Jena and a JDK come from nixpkgs unless JENA_HOME and JAVA are set (not part of ci; also the flake's jena-clients check)"
run = "scripts/test-jena-clients.sh"

[tasks.ci]
description = "Everything CI should run: formatting, lints, cited paths in the docs, the formatter's browser build, Rust, UI, Python, JVM and Node binding tests, third-party license notices up to date. Logs go to target/ci/logs, and target/ci/summary.txt shows each task's state while it runs"
usage = '''
flag "--fail-fast" help="stop the remaining tasks after the first failure"
flag "--force" help="run every check even when the task cache has a pass for it"
flag "--jobs <n>" help="tasks run at once" default="2"
arg "[task]..." help="run only these CI tasks" var=#true
'''
run = 'scripts/ci.sh --jobs "$usage_jobs" ${usage_fail_fast:+--fail-fast} ${usage_force:+--force} ${usage_task:-}'

[tasks."ci:fast"]
description = "The quick CI subset for iterating: formatting, cited doc paths, Clippy on the workspace and the Rust tests"
run = "scripts/ci.sh --fast"

# ------------------------------------------------------------------- Python bindings ----
# crates/sparkles-py is its own cargo workspace (see its Cargo.toml). These tasks build it
# in the root target directory, so it reuses the workspace's compiled dependencies.

[tasks."py:build"]
description = "Build the Python bindings' release wheel (abi3, CPython 3.10+) with maturin into target/wheels; extra args go to `maturin build`"
tools = { "github:PyO3/maturin" = "1.15.0" }
run = "maturin build --release --locked --manifest-path crates/sparkles-py/Cargo.toml --target-dir target --out target/wheels"

[tasks."py:sdist"]
description = "Build the Python bindings' source distribution into target/wheels, with the vendored spargebra that maturin leaves out"
tools = { "github:PyO3/maturin" = "1.15.0" }
run = "python3 scripts/py-sdist.py target/wheels"

[tasks."py:test"]
sources = ["@group:rust", "scripts/py-test.sh"]
outputs = []
description = "Build the Python extension and run its pytest suite (python3 from PATH, with pytest from the dev shell or a venv in target/py-venv); extra args go to pytest"
run = "scripts/py-test.sh"

[tasks."py:wheel-test"]
description = "Install a built wheel or sdist into a fresh venv for each given python and run the pytest suite against it: mise run py:wheel-test -- target/wheels/<file> python3"
run = "scripts/py-wheel-test.sh"

[tasks."py:lint"]
sources = ["@group:rust"]
outputs = []
description = "Clippy (warnings are errors) on the Python bindings, with their default features and with none"
run = [
  "cargo clippy --manifest-path crates/sparkles-py/Cargo.toml --target-dir target --all-targets -- -D warnings",
  "cargo clippy --manifest-path crates/sparkles-py/Cargo.toml --target-dir target --all-targets --no-default-features -- -D warnings",
]

[tasks."py:lock"]
description = "Refresh crates/sparkles-py/Cargo.lock from the root Cargo.lock, after the workspace's dependencies change"
run = [
  "cp Cargo.lock crates/sparkles-py/Cargo.lock",
  "cargo metadata --manifest-path crates/sparkles-py/Cargo.toml --format-version 1 > /dev/null",
]

# ---------------------------------------------------------------------- JVM bindings ----
# crates/sparkles-ffi is its own cargo workspace (see its Cargo.toml), built in the root
# target directory so that it reuses the workspace's compiled dependencies. jvm/ is the Gradle
# build of the Kotlin library, run through its checked-in wrapper.

[tasks."jvm:native"]
description = "Build the JVM bindings' native library (crates/sparkles-ffi, release; JVM_PROFILE=dev for an unoptimized one) and generate its Kotlin bindings into target/jvm/uniffi"
run = "scripts/jvm-native.sh"

[tasks."jvm:build"]
description = "Build the sparkles-jena jar (jvm/sparkles-jena/build/libs), with the host's native library inside"
depends = ["jvm:native"]
dir = "jvm"
run = "./gradlew --console=plain :sparkles-jena:assemble"

[tasks."jvm:test"]
sources = ["@group:rust", "@group:jvm", "scripts/jvm-native.sh"]
outputs = []
description = "Jena's contract tests and the binding's own tests on the host's native library; extra args go to Gradle"
depends = ["jvm:native"]
dir = "jvm"
run = "./gradlew --console=plain :sparkles-jena:test"

[tasks."jvm:sample"]
description = "Compile the Java sample (jvm/sample-java) with -Xlint:all -Werror against the library, run its tests, and run it"
depends = ["jvm:native"]
dir = "jvm"
run = "./gradlew --console=plain :sample-java:build :sample-java:run"

[tasks."jvm:lint"]
sources = ["@group:rust"]
outputs = []
description = "Clippy (warnings are errors) on the JVM bindings' native library, with its default features and with none"
run = [
  "cargo clippy --manifest-path crates/sparkles-ffi/Cargo.toml --target-dir target --all-targets -- -D warnings",
  "cargo clippy --manifest-path crates/sparkles-ffi/Cargo.toml --target-dir target --all-targets --no-default-features -- -D warnings",
]

[tasks."jvm:rust-test"]
sources = ["@group:rust"]
outputs = []
description = "The native library's Rust tests (the batch encoding and the objects the Kotlin library uses)"
run = "cargo test --manifest-path crates/sparkles-ffi/Cargo.toml --target-dir target"

[tasks."jvm:lock"]
description = "Refresh crates/sparkles-ffi/Cargo.lock from the root Cargo.lock, after the workspace's dependencies change"
run = [
  "cp Cargo.lock crates/sparkles-ffi/Cargo.lock",
  "cargo metadata --manifest-path crates/sparkles-ffi/Cargo.toml --format-version 1 > /dev/null",
]

[tasks."jvm:nix-deps"]
description = "Refresh nix/jvm-deps.json, the Gradle dependencies the Nix build of the jar fetches (after jvm/ dependencies change)"
run = "nix build .#sparkles-jena.mitmCache.updateScript -o target/jvm-nix-deps-update && target/jvm-nix-deps-update"

# --------------------------------------------------------------------- Node bindings ----

[tasks."node:native"]
tools = { node = "24" }
description = "Build and stage the host's Node-API addon (NODE_PROFILE=dev for a debug build)"
run = "scripts/node-native.sh"

[tasks."node:build"]
tools = { node = "24" }
description = "Build the shared RDF/JS contracts, remote client and native engine packages"
depends = ["node:native"]
run = "pnpm --dir js build"

[tasks."node:test"]
sources = ["@group:rust", "@group:js", "scripts/node-native.sh"]
outputs = []
tools = { node = "24" }
description = "Test Node bindings, remote client and transaction/lifecycle contracts, with the remote client's tests against a debug server"
depends = ["node:build"]
dir = "js"
env = { SPARKLES_CLIENT_TEST_SERVER_BIN = "{{config_root}}/target/debug/sparkles" }
run = [
  "cargo build --locked --manifest-path ../Cargo.toml -p sparkles-server --bin sparkles",
  "node --test common/test/*.test.mjs client/test/*.test.mjs engine/test/*.test.mjs",
]

[tasks."node:lint"]
sources = ["@group:rust"]
outputs = []
description = "Clippy on the Node addon with default features and with none"
run = [
  "cargo clippy --manifest-path crates/sparkles-node/Cargo.toml --target-dir target --all-targets -- -D warnings",
  "cargo clippy --manifest-path crates/sparkles-node/Cargo.toml --target-dir target --all-targets --no-default-features -- -D warnings",
]

[tasks."node:client:gen"]
tools = { node = "24" }
description = "Regenerate the remote TypeScript client's OpenAPI types"
run = "pnpm --dir js client:gen"

[tasks."node:client:check"]
sources = ["@group:js", "docs/openapi.json"]
outputs = []
tools = { node = "24" }
description = "Check that the TypeScript client's generated OpenAPI types are current"
run = "pnpm --dir js client:check"

[tasks."node:fmt"]
tools = { node = "24" }
description = "Format the JavaScript and TypeScript bindings"
run = "pnpm --dir js format"

[tasks."node:fmt:check"]
sources = ["@group:js"]
outputs = []
tools = { node = "24" }
description = "Check JavaScript and TypeScript formatting"
run = "pnpm --dir js format:check"

[tasks."node:lock"]
description = "Refresh the Node addon's Cargo.lock from the workspace's lock"
run = [
  "cp Cargo.lock crates/sparkles-node/Cargo.lock",
  "cargo metadata --manifest-path crates/sparkles-node/Cargo.toml --format-version 1 > /dev/null",
]

# -------------------------------------------------------------------------- build / run ----

[tasks.build]
description = "Release build of the server/CLI with the embedded UI"
depends = ["ui:build"]
run = "cargo build --release -p sparkles-server"

[tasks."docker:build"]
description = "Build the Docker image of compose.yaml (Dockerfile: UI, formatter WebAssembly and release binary); SPARKLES_BUILD_JOBS=N caps the compile jobs; not part of ci"
run = "docker compose build"

[tasks.licenses]
description = "Regenerate THIRD_PARTY_LICENSES.md (the crates the binary links, from Cargo.lock) and THIRD_PARTY_LICENSES-UI.md (the npm packages in the UI bundle, written by the UI build)"
depends = ["ui:build"]
run = [
  "python3 scripts/third-party-licenses.py",
  "cp ui/build/licenses.txt THIRD_PARTY_LICENSES-UI.md",
]

[tasks."licenses:check"]
sources = ["@group:rust", "@group:ui", "THIRD_PARTY_LICENSES.md", "THIRD_PARTY_LICENSES-UI.md", "scripts/third-party-licenses.py"]
outputs = []
description = "Check that THIRD_PARTY_LICENSES.md matches Cargo.lock and THIRD_PARTY_LICENSES-UI.md the UI bundle (the UI build fails on a non-permissive license)"
depends = ["ui:build"]
run = [
  "python3 scripts/third-party-licenses.py --check",
  "cmp -s ui/build/licenses.txt THIRD_PARTY_LICENSES-UI.md || { echo 'THIRD_PARTY_LICENSES-UI.md is out of date: run `mise run licenses`' >&2; exit 1; }",
]

[tasks.serve]
description = "Run the server (UI at http://localhost:3030/ui/); extra args go to `sparkles serve`"
depends = ["build"]
run = "./target/release/sparkles serve --data ./data"

[tasks.doc]
description = "API docs for the library crates"
run = "cargo doc --workspace --no-deps --exclude sparkles-server"

[tasks.openapi]
description = "Rewrite docs/openapi.json, the checked-in copy of the OpenAPI description (a test fails while it is out of date)"
env = { SPARKLES_UPDATE_OPENAPI = "1" }
run = "cargo test -p sparkles-server --bin sparkles openapi::tests::checked_in_copy_is_current"

[tasks."docs:screenshots"]
description = "The README's screenshots (docs/images/*.png): the release build serves the demo dataset of docs/demo on a free port, Playwright drives the UI in dark mode, oxipng shrinks the images (not part of ci)"
depends = ["build", "ui:e2e:browsers"]
dir = "ui"
tools = { "github:shssoichiro/oxipng" = "10.2.1" }
run = '''
pnpm screenshots
oxipng --quiet --opt 4 --strip safe ../docs/images/*.png
'''

[tasks.gen-data]
description = "Generate a synthetic N-Triples dataset (~10.5 triples per person)"
usage = '''
arg "[people]" default="100000" help="number of people to generate"
arg "[out]" default="target/bench-data/data.nt" help="output file"
'''
run = '''
mkdir -p "$(dirname "$usage_out")"
python3 scripts/gen-data.py "$usage_people" > "$usage_out"
wc -l "$usage_out"
'''

[tasks.clean]
description = "Remove build outputs"
run = ["cargo clean", "rm -rf ui/build ui/.svelte-kit"]

# ---------------------------------------------------------------------------- benchmarks ----

[tasks.bench]
description = "Sparkles vs Jena/Fuseki, QLever, Fluree and Oxigraph over HTTP: load, queries, memory, updates, mixed load and cold starts (results merge per engine)"
depends = ["build"]
usage = '''
arg "[people]" default="100000" help="dataset size in people (~10.5 triples each)"
arg "[workdir]" default="target/bench" help="data, indexes and results/ (summary.md)"
flag "--runs <n>" default="10" help="measured runs per query"
flag "--warmup <n>" default="2" help="warm-up runs per query"
flag "--skip-load" help="reuse indexes from a previous run in the same workdir"
flag "--skip-queries" help="reuse per-query results; re-run updates / throughput / memory"
flag "--answers-only" help="only re-check answers across engines and rebuild the summary"
flag "--engines <list>" default="sparkles jena qlever fluree oxigraph" help="engines to (re-)measure; others' results are kept"
flag "--queries <list>" help="only these queries (default: all 28)"
flag "--mode <mode>" default="default" help="default (load and queries), updates (queries after a churn of commits, into results-updates/), mixed (readers and a writer at once) or cold (a restart with evicted page cache per query)"
flag "--churn <n>" default="5000" help="updates mode: single-triple commits before the queries"
flag "--mixed-seconds <s>" default="30" help="mixed mode: seconds per engine"
flag "--write-rate <n>" default="0" help="mixed mode: commits per second (0: as fast as the engine answers)"
flag "--cold-runs <n>" default="3" help="cold mode: restarts per query"
flag "--port-base <port>" default="3931" help="the first of the five server ports"
'''
run = '''
RUNS="$usage_runs" WARMUP="$usage_warmup" ENGINES="$usage_engines" QUERIES="${usage_queries:-}" \
SKIP_LOAD="${usage_skip_load:+1}" SKIP_QUERIES="${usage_skip_queries:+1}" \
ANSWERS_ONLY="${usage_answers_only:+1}" MODE="$usage_mode" CHURN="$usage_churn" \
MIXED_SECONDS="$usage_mixed_seconds" WRITE_RATE="$usage_write_rate" COLD_RUNS="$usage_cold_runs" \
PORT_BASE="$usage_port_base" scripts/bench.sh "$usage_people" "$(realpath -m "$usage_workdir")"
'''

[tasks."bench:text"]
description = "Full-text search: Sparkles text:query vs Fuseki with jena-text vs QLever text search (hyperfine over HTTP)"
depends = ["build"]
usage = '''
arg "[people]" default="100000" help="dataset size in people (~10.5 triples each)"
arg "[workdir]" default="target/bench-text" help="data, stores, text indexes and results/ (text-summary.md)"
flag "--runs <n>" default="10" help="measured runs per query"
flag "--warmup <n>" default="2" help="warm-up runs per query"
flag "--skip-load" help="reuse the stores and text indexes from a previous run in the same workdir"
flag "--answers-only" help="only check answers across engines and rebuild the summary"
flag "--engines <list>" default="sparkles jena qlever" help="engines to (re-)measure; others' results are kept"
flag "--queries <list>" help="only these queries (default: all 7)"
flag "--data <file>" help="reuse a generated dataset, e.g. target/bench/data.nt"
flag "--port-base <n>" default="3940" help="the servers listen on the three ports after it"
'''
run = '''
RUNS="$usage_runs" WARMUP="$usage_warmup" ENGINES="$usage_engines" QUERIES="${usage_queries:-}" \
SKIP_LOAD="${usage_skip_load:+1}" ANSWERS_ONLY="${usage_answers_only:+1}" \
DATA="${usage_data:+$(realpath "$usage_data")}" PORT_BASE="$usage_port_base" \
scripts/bench-text.sh "$usage_people" "$(realpath -m "$usage_workdir")"
'''

[tasks."bench:vector"]
description = "Vector search: build time, memory, recall@10 and latency of the HNSW index against the exact search, over HTTP (hyperfine and a keep-alive client)"
depends = ["build"]
usage = '''
arg "[n]" default="100000" help="vectors to generate and load"
arg "[dim]" default="384" help="their dimension"
arg "[workdir]" default="target/bench-vector" help="data, store and results/ (summary.md), per size"
flag "--queries <n>" default="1000" help="query vectors (recall and client latency)"
flag "--efs <list>" default="16 32 64 128 256" help="efSearch values to measure"
flag "--runs <n>" default="20" help="hyperfine runs per mode"
flag "--warmup <n>" default="3" help="hyperfine warm-up runs per mode"
flag "--m <n>" default="16" help="HNSW links per node"
flag "--ef-construction <n>" default="128" help="HNSW candidates while building"
flag "--skip-load" help="reuse the store and index of an earlier run in the same workdir"
flag "--port <n>" default="4800" help="the server's port"
'''
run = '''
QUERIES="$usage_queries" EFS="$usage_efs" RUNS="$usage_runs" WARMUP="$usage_warmup" M="$usage_m" \
EFC="$usage_ef_construction" SKIP_LOAD="${usage_skip_load:+1}" PORT="$usage_port" \
scripts/bench-vector.sh "$usage_n" "$usage_dim" "$(realpath -m "$usage_workdir")"
'''

[tasks."bench:watdiv"]
description = "WatDiv basic testing (20 templates: linear, star, snowflake, complex): the five engines of bench, answers checked first"
depends = ["build"]
usage = '''
arg "[scale]" default="100" help="WatDiv scale factor (1 is about 112k triples, 100 about 11.0M)"
arg "[workdir]" default="target/bench-watdiv" help="generator, data, queries, indexes and results/ (summary.md)"
flag "--runs <n>" default="10" help="measured runs per query instance"
flag "--warmup <n>" default="2" help="warm-up runs per query instance"
flag "--instances <n>" default="5" help="query instances per template (fixed seed)"
flag "--skip-load" help="reuse indexes from a previous run in the same workdir"
flag "--answers-only" help="only re-check answers across engines and rebuild the summary"
flag "--engines <list>" default="sparkles jena qlever fluree oxigraph" help="engines to (re-)measure; others' results are kept"
flag "--queries <list>" help="only these templates or instances (L1 S3-2 …)"
'''
run = '''
RUNS="$usage_runs" WARMUP="$usage_warmup" INSTANCES="$usage_instances" ENGINES="$usage_engines" \
QUERIES="${usage_queries:-}" SKIP_LOAD="${usage_skip_load:+1}" ANSWERS_ONLY="${usage_answers_only:+1}" \
scripts/bench-watdiv.sh "$usage_scale" "$(realpath -m "$usage_workdir")"
'''

[tasks."bench:billion"]
description = "Real-data benchmark on English DBpedia 2022.12 at a chosen scale, up to 1.24B triples: Sparkles vs QLever (also Jena, Oxigraph, Fluree); downloads and indexes are cached"
depends = ["build"]
usage = '''
arg "[scale]" default="50m" help="triples to load (10m, 50m, 250m, 1b…) or full"
flag "--workdir <dir>" default="target/bench-billion" help="downloads, normalized data, and per scale the indexes and results/ (summary.md)"
flag "--engines <list>" default="sparkles qlever" help="engines: sparkles, qlever, jena (TDB2 xloader + Fuseki), oxigraph, fluree"
flag "--steps <list>" default="fetch prepare slice load queries report" help="steps to run"
flag "--reload" help="rebuild the engines' indexes at this scale"
flag "--runs <n>" default="5" help="measured runs per query"
flag "--warmup <n>" default="1" help="warm-up runs per query"
flag "--no-cold" help="skip the cold runs (a restart with evicted page cache per query)"
flag "--answers-only" help="only check answers across engines and rebuild the summary"
flag "--queries <list>" help="only these queries (names in scripts/bench-billion/queries)"
'''
run = '''
SCALE="$usage_scale" WORKDIR="$(realpath -m "$usage_workdir")" ENGINES="$usage_engines" \
RELOAD="${usage_reload:+1}" RUNS="$usage_runs" WARMUP="$usage_warmup" COLD="${usage_no_cold:+0}" \
ANSWERS_ONLY="${usage_answers_only:+1}" QUERIES="${usage_queries:-}" \
scripts/bench-billion.sh $usage_steps
'''

[tasks."bench:reasoner"]
description = "RDFS / OWL RL materialization benchmark on generated data"
usage = '''
arg "[triples]" default="100000"
arg "[profile]" default="rdfs" help="rdfs | rdfs-simple | owl-rl"
'''
run = 'cargo run --release -p sparkles-reasoner --example bench -- "$usage_triples" "$usage_profile"'

[tasks."bench:shacl"]
description = "SHACL validation benchmark on generated data"
usage = '''
arg "[people]" default="10000"
'''
run = '''
mkdir -p target/bench-data
f="target/bench-data/shacl-$usage_people.nt"
[ -f "$f" ] || python3 scripts/gen-data.py "$usage_people" > "$f"
cargo run --release -p sparkles-shacl --example bench -- "$f" - 5
'''

[tasks."bench:shex"]
description = "ShEx validation benchmark on generated data"
usage = '''
arg "[people]" default="10000"
flag "--compare-rudof" help="also compare the result map with an installed rudof (scripts/shex-diff.sh)"
'''
run = '''
mkdir -p target/bench-data
f="target/bench-data/shacl-$usage_people.nt"
[ -f "$f" ] || python3 scripts/gen-data.py "$usage_people" > "$f"
cargo run --release -p sparkles-shex --example bench -- "$f" - 5
if [ -n "${usage_compare_rudof:-}" ]; then
  scripts/shex-diff.sh --compare-rudof "$f" crates/sparkles-shex/examples/bench.shex crates/sparkles-shex/examples/bench.smap
fi
'''

