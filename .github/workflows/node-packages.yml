# Build/install checks; publishing additionally requires an explicitly enabled npm environment.
#
# Addons are built for Linux on x64 and arm64 (glibc and musl) and for macOS on Apple
# silicon. The jobs run on Namespace runners with a cache volume per platform, shared with
# the other workflows and written back only from main.
name: Node packages
on:
  push:
    tags: ['node-v*']
  pull_request:
    paths: ['crates/**', 'vendor/**', 'js/**', 'Cargo.toml', 'scripts/node-native.sh', '.github/workflows/node-packages.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: node-packages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  # Pull requests build the bindings in the dev profile, which compiles far faster than the
  # release profile's thin LTO; tags and manual runs build what would be published.
  NODE_PROFILE: ${{ github.event_name == 'pull_request' && 'dev' || 'release' }}
jobs:
  native:
    timeout-minutes: 45
    # Pull requests build and test linux-x64 only. Tags and manual runs build every
    # platform.
    strategy:
      fail-fast: false
      matrix:
        platform: [linux-x64, linux-arm64, darwin-arm64]
        exclude:
          - platform: ${{ github.event_name == 'pull_request' && 'linux-arm64' || 'none' }}
          - platform: ${{ github.event_name == 'pull_request' && 'darwin-arm64' || 'none' }}
    runs-on: ${{ fromJSON(matrix.platform == 'darwin-arm64' && '["nscloud-macos-sequoia-arm64-6x14-with-cache", "nscloud-cache-tag-sparkles-macos-arm64", "nscloud-cache-size-50gb", "nscloud-cache-allow-commit-from-main", "nscloud-git-mirror-5gb"]' || format('["nscloud-ubuntu-24.04-{0}-8x16-with-cache", "nscloud-cache-tag-sparkles-linux-{0}", "nscloud-cache-size-50gb", "nscloud-cache-allow-commit-from-main", "nscloud-git-mirror-5gb"]', matrix.platform == 'linux-arm64' && 'arm64' || 'amd64')) }}
    steps:
      - uses: namespacelabs/nscloud-checkout-action@v8
      - uses: actions/setup-node@v5
        with: {node-version: '24', package-manager-cache: false}
      - name: Check release tag matches package versions
        if: startsWith(github.ref, 'refs/tags/')
        run: node js/scripts/check-version.mjs "${{ github.ref_name }}"
      - uses: pnpm/action-setup@v4
        with: {version: '10.34.5'}
      - uses: dtolnay/rust-toolchain@stable
      - uses: namespacelabs/nscloud-cache-action@v1
        with:
          cache: |
            pnpm
            rust
      - run: pnpm --dir js install --frozen-lockfile
      - name: Build native Node-API module
        working-directory: js/engine
        shell: bash
        run: |
          if [ "$NODE_PROFILE" = release ]; then pnpm native; else
            pnpm exec napi build --manifest-path ../../crates/sparkles-node/Cargo.toml --platform --output-dir native
          fi
      - run: pnpm --dir js build
      # The remote client's real-server test runs on one runner, against a debug server.
      - name: Build the server for the remote client test
        if: matrix.platform == 'linux-x64'
        run: cargo build --locked -p sparkles-server --bin sparkles
      - name: Test Node 22, 24 and 26
        shell: bash
        env:
          SPARKLES_CLIENT_TEST_SERVER_BIN: ${{ matrix.platform == 'linux-x64' && format('{0}/target/debug/sparkles', github.workspace) || '' }}
        run: |
          for major in 22 24 26; do
            npx --yes --package node@$major node --test js/common/test/*.test.mjs js/client/test/*.test.mjs js/engine/test/*.test.mjs
          done
      - name: Package native target
        run: node js/scripts/platforms.mjs
      - name: Pack runtime/type dependency closure
        run: node js/scripts/pack-runtime.mjs packed
      - name: Test installed package archives
        shell: bash
        run: |
          mkdir installed
          cd installed
          npm init -y
          npm install --offline --ignore-scripts --omit=optional ../packed/*.tgz
          cp ../js/scripts/packed-smoke.mjs ../js/scripts/packed-types.mts .
          node packed-smoke.mjs
          node node_modules/typescript/bin/tsc --noEmit --strict --target es2023 --module nodenext packed-types.mts
      - uses: oven-sh/setup-bun@v2
      - run: bun js/scripts/runtime-smoke.mjs
      - uses: denoland/setup-deno@v2
        with: {deno-version: v2.x}
      - run: deno run --allow-read --allow-write --allow-env --allow-sys --allow-ffi js/scripts/runtime-smoke.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: node-${{ matrix.platform }}
          path: packed/sparkles-rdf-*.tgz
  musl:
    timeout-minutes: 60
    # tags and manual runs only
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    runs-on:
      - nscloud-ubuntu-24.04-${{ matrix.arch }}-8x16-with-cache
      - nscloud-cache-tag-sparkles-linux-${{ matrix.arch }}-musl
      - nscloud-cache-size-50gb
      - nscloud-cache-allow-commit-from-main
      - nscloud-git-mirror-5gb
    steps:
      - uses: namespacelabs/nscloud-checkout-action@v8
      # The build runs in an Alpine container with the workspace mounted. Its Rust toolchain,
      # Cargo registry, pnpm store and target directory live in the workspace so that the
      # cache volume keeps them between runs. The volume is separate from the glibc one
      # because these artifacts are built for musl.
      - uses: namespacelabs/nscloud-cache-action@v1
        with:
          path: |
            target
            .cache/musl
      - name: Build and test the addon on Alpine
        run: |
          docker run --rm -e NODE_PROFILE -v "$PWD:/work" -w /work node:24-alpine sh -ec '
            apk add --no-cache bash curl build-base cmake perl git
            export CARGO_HOME=/work/.cache/musl/cargo RUSTUP_HOME=/work/.cache/musl/rustup
            export PATH="$CARGO_HOME/bin:$PATH"
            if [ ! -x "$CARGO_HOME/bin/cargo" ]; then
              curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --no-modify-path
            fi
            npm install -g pnpm@10.34.5
            pnpm config set store-dir /work/.cache/musl/pnpm
            pnpm --dir js install --frozen-lockfile
            bash scripts/node-native.sh
            pnpm --dir js build
            node --test js/common/test/*.test.mjs js/client/test/*.test.mjs js/engine/test/*.test.mjs
            node js/scripts/platforms.mjs
            node js/scripts/pack-runtime.mjs packed
            mkdir installed
            cd installed
            npm init -y
            npm install --offline --ignore-scripts --omit=optional ../packed/*.tgz
            cp ../js/scripts/packed-smoke.mjs ../js/scripts/packed-types.mts .
            node packed-smoke.mjs
            node node_modules/typescript/bin/tsc --noEmit --strict --target es2023 --module nodenext packed-types.mts
          '
      - uses: actions/upload-artifact@v4
        with:
          name: node-musl-${{ matrix.arch }}
          path: packed/sparkles-rdf-*.tgz
  publish:
    timeout-minutes: 15
    if: startsWith(github.ref, 'refs/tags/node-v') && vars.NPM_PUBLISH == 'true'
    needs: [native, musl]
    runs-on: ubuntu-24.04
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v5
        with: {node-version: '24', registry-url: 'https://registry.npmjs.org'}
      - uses: actions/download-artifact@v4
        with: {path: artifacts, merge-multiple: false}
      # Trusted publishing (OIDC) needs npm 11.5.1 or later and a trusted publisher set up
      # on npmjs.com for each package. npm accepts that only for packages that already
      # exist, so the first release authenticates with the NPM_TOKEN secret instead. Once
      # every package is published and trusts this workflow, delete the secret.
      - name: Use an npm that supports trusted publishing
        run: npm install --global npm@11.6.2
      - name: Publish packages
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          mkdir unique
          find artifacts -name 'sparkles-rdf-*.tgz' -exec cp -n {} unique/ \;
          # The platform packages first, so that the engine's optional dependencies exist
          # when the engine is published.
          for package in unique/sparkles-rdf-engine-linux-*.tgz unique/sparkles-rdf-engine-darwin-*.tgz unique/sparkles-rdf-common-*.tgz unique/sparkles-rdf-engine-[0-9]*.tgz unique/sparkles-rdf-client-*.tgz; do
            [ -f "$package" ] || continue
            spec=$(tar -xOzf "$package" package/package.json | node -e 'const p = JSON.parse(require("fs").readFileSync(0)); console.log(p.name + "@" + p.version)')
            # A rerun after a partial failure skips what is already published.
            if npm view "$spec" version > /dev/null 2>&1; then
              echo "$spec is already published"
              continue
            fi
            npm publish "$package" --access public --provenance
          done
