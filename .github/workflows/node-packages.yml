# Build/install checks; publishing additionally requires an explicitly enabled npm environment.
#
# Addons are built for Linux on x64 and arm64 (glibc and musl) and for macOS on Apple
# silicon. The jobs run on standard GitHub-hosted runners with Cargo and pnpm
# dependencies cached in GitHub Actions or the remote mbx server.
name: Node packages
# Pushes to main and pull requests run when the Node packages or a crate the addon builds
# on changes, or when the server used by the remote client tests changes. Tests, benches
# and examples of those crates do not change the builds.
on:
  push:
    branches: [main]
    tags: ['node-v*']
    paths: &paths
      - 'crates/sparkles/**'
      - 'crates/sparkles-alloc/**'
      - 'crates/sparkles-backup/**'
      - 'crates/sparkles-client/**'
      - 'crates/sparkles-core/**'
      - 'crates/sparkles-fmt/**'
      - 'crates/sparkles-graphql/**'
      - 'crates/sparkles-memory-import/**'
      - 'crates/sparkles-modelstore/**'
      - 'crates/sparkles-node/**'
      - 'crates/sparkles-office/**'
      - 'crates/sparkles-reasoner/**'
      # the remote client's tests build the default-feature server
      - 'crates/sparkles-server/**'
      - 'crates/sparkles-shacl/**'
      - 'crates/sparkles-shex/**'
      - '!crates/sparkles*/tests/**'
      - '!crates/sparkles*/benches/**'
      - '!crates/sparkles*/examples/**'
      - 'vendor/**'
      - 'js/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'scripts/node-native.sh'
      - 'scripts/install-mbx-container.sh'
      - 'scripts/node-native.sh'
      - 'scripts/ci-node-musl.sh'
      - 'mise.toml'
      - '.github/workflows/node-packages.yml'
  pull_request:
    paths: *paths
  workflow_dispatch:
permissions:
  contents: read
# Main runs have distinct groups so neither running nor pending checks are superseded.
# Pull request updates supersede earlier checks; tag runs are never cancelled.
concurrency:
  group: node-packages-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.run_id || 'latest' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref_type != 'tag' }}
env:
  MBX_HTTP_TIMEOUT: 5m
  MBX_GC_MAX_SIZE: 10GiB
  # Only same-repository PRs may publish to the remote cache.
  MBX_REMOTE_TRUST_WRITES: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && 'true' || 'false' }}
  # Pushes to main and pull requests build the bindings in the dev profile, which compiles
  # far faster than the release profile's thin LTO; tags and manual runs build what would
  # be published.
  NODE_PROFILE: ${{ github.ref_type == 'branch' && github.event_name != 'workflow_dispatch' && 'dev' || 'release' }}
jobs:
  native:
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 45
    # Pushes to main and pull requests build and test linux-x64 only. Tags and manual runs
    # build every platform.
    strategy:
      fail-fast: false
      matrix:
        platform: [linux-x64, linux-arm64, darwin-arm64]
        exclude:
          - platform: ${{ github.ref_type == 'branch' && github.event_name != 'workflow_dispatch' && 'linux-arm64' || 'none' }}
          - platform: ${{ github.ref_type == 'branch' && github.event_name != 'workflow_dispatch' && 'darwin-arm64' || 'none' }}
    runs-on: ${{ matrix.platform == 'darwin-arm64' && 'macos-15' || matrix.platform == 'linux-arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with: {version: '10.34.5'}
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: js/pnpm-lock.yaml
      - name: Check release tag matches package versions
        if: startsWith(github.ref, 'refs/tags/')
        run: node js/scripts/check-version.mjs "${{ github.ref_name }}"
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with: { cache: false, rustflags: "" }
      - uses: jdx/mr-boxington-action@v1.7.3
        with:
          # Fork pull requests use GitHub cache because they cannot request an OIDC token.
          backend: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) && 'remote' || 'github' }}
          remote-url: https://mbx.kclj.dev
          namespace: kclejeune/sparkles
          oidc-audience: https://mbx.kclj.dev
          version: 1.28.0
          github-cache-mode: objects
          cache-generation: sparkles-node-${{ matrix.platform }}-${{ env.NODE_PROFILE }}-v1
          save-on-workflow-dispatch: ${{ github.ref == 'refs/heads/main' }}
      # This build tool invokes Cargo itself.
      - name: Route build-tool Cargo calls through Boxington
        shell: bash
        run: |
          mbx setup --yes
          case "$RUNNER_OS" in
            Linux) printf '%s\n' "${XDG_DATA_HOME:-$HOME/.local/share}/mbx/bin" >> "$GITHUB_PATH" ;;
            macOS) printf '%s\n' "$HOME/Library/Application Support/mbx/bin" >> "$GITHUB_PATH" ;;
          esac
      - run: pnpm --dir js install --frozen-lockfile
      - name: Disk space before build
        run: df -h "$GITHUB_WORKSPACE"
      - name: Build native Node-API module
        working-directory: js/engine
        shell: bash
        run: |
          if [ "$NODE_PROFILE" = release ]; then pnpm native; else
            pnpm exec napi build --manifest-path ../../crates/sparkles-node/Cargo.toml --platform --output-dir native
          fi
      - name: Disk space after build
        if: ${{ always() }}
        run: df -h "$GITHUB_WORKSPACE"
      - run: pnpm --dir js build
      # The remote client's real-server test runs on one runner, against a debug server.
      - name: Build the server for the remote client test
        if: matrix.platform == 'linux-x64'
        run: mbx build --locked -p sparkles-server --bin sparkles
      - name: Test Node 22, 24 and 26
        shell: bash
        env:
          SPARKLES_CLIENT_TEST_SERVER_BIN: ${{ matrix.platform == 'linux-x64' && format('{0}/target/debug/sparkles', github.workspace) || '' }}
        run: |
          for major in 22 24 26; do
            npx --yes --package node@$major node --test js/common/test/*.test.mjs js/client/test/*.test.mjs js/engine/test/*.test.mjs
          done
      - name: Package native target
        run: node js/scripts/platforms.mjs
      - name: Pack runtime/type dependency closure
        run: node js/scripts/pack-runtime.mjs packed
      - name: Test installed package archives
        shell: bash
        run: |
          mkdir installed
          cd installed
          npm init -y
          npm install --offline --ignore-scripts --omit=optional ../packed/*.tgz
          cp ../js/scripts/packed-smoke.mjs ../js/scripts/packed-types.mts .
          node packed-smoke.mjs
          node node_modules/typescript/bin/tsc --noEmit --strict --target es2023 --module nodenext packed-types.mts
      - uses: oven-sh/setup-bun@v2
      - run: bun js/scripts/runtime-smoke.mjs
      - uses: denoland/setup-deno@v2
        with: {deno-version: v2.x}
      - run: deno run --allow-read --allow-write --allow-env --allow-sys --allow-ffi js/scripts/runtime-smoke.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: node-${{ matrix.platform }}
          path: packed/sparkles-rdf-*.tgz
  musl:
    timeout-minutes: 60
    # tags and manual runs only
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    env:
      MBX_CACHE_DIR: ${{ github.workspace }}/.cache/mbx
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with: { cache: false, rustflags: "" }
      - uses: jdx/mr-boxington-action@v1.7.3
        with:
          version: 1.28.0
          github-cache-mode: objects
          cache-generation: sparkles-node-musl-${{ env.NODE_PROFILE }}-v1
          save-on-workflow-dispatch: ${{ github.ref == 'refs/heads/main' }}
      # Rustup and pnpm remain tool caches. Compiler outputs
      # are carried by the mbx action rather than a second cached target tree.
      - uses: actions/cache/restore@v4
        id: musl-tools
        with:
          path: |
            .cache/musl/cargo/bin
            .cache/musl/rustup
            .cache/musl/pnpm
          key: node-musl-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'js/pnpm-lock.yaml') }}
          restore-keys: node-musl-tools-${{ runner.os }}-${{ runner.arch }}-
      - name: Build and test the addon on Alpine
        run: |
          docker run --rm -e CI=true -e NODE_PROFILE -e MBX_CACHE_EXPORT_GROUP -e MBX_GC_MAX_SIZE \
            -e MBX_CACHE_DIR=/work/.cache/mbx -e MBX_SHIMS_DIR=/work/.cache/container-shims \
            -v "$PWD:/work" -w /work node:24-alpine \
            sh -ec 'apk add --no-cache bash; exec bash scripts/ci-node-musl.sh'
      - name: Restore host ownership of container cache files
        if: always()
        run: |
          if [ -d .cache ]; then sudo chown -R "$(id -u):$(id -g)" .cache; fi
      - uses: actions/cache/save@v4
        if: github.ref == 'refs/heads/main' && steps.musl-tools.outputs.cache-hit != 'true'
        with:
          path: |
            .cache/musl/cargo/bin
            .cache/musl/rustup
            .cache/musl/pnpm
          key: ${{ steps.musl-tools.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v4
        with:
          name: node-musl-${{ matrix.arch }}
          path: packed/sparkles-rdf-*.tgz
  publish:
    timeout-minutes: 15
    if: startsWith(github.ref, 'refs/tags/node-v') && vars.NPM_PUBLISH == 'true'
    needs: [native, musl]
    runs-on: ubuntu-24.04
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v5
        with: {node-version: '24', registry-url: 'https://registry.npmjs.org'}
      - uses: actions/download-artifact@v4
        with: {path: artifacts, merge-multiple: false}
      # Trusted publishing (OIDC) needs npm 11.5.1 or later and a trusted publisher set up
      # on npmjs.com for each package. npm accepts that only for packages that already
      # exist, so the first release authenticates with the NPM_TOKEN secret instead. Once
      # every package is published and trusts this workflow, delete the secret.
      - name: Use an npm that supports trusted publishing
        run: npm install --global npm@11.6.2
      - name: Publish packages
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          mkdir unique
          find artifacts -name 'sparkles-rdf-*.tgz' -exec cp -n {} unique/ \;
          # The platform packages first, so that the engine's optional dependencies exist
          # when the engine is published.
          for package in unique/sparkles-rdf-engine-linux-*.tgz unique/sparkles-rdf-engine-darwin-*.tgz unique/sparkles-rdf-common-*.tgz unique/sparkles-rdf-engine-[0-9]*.tgz unique/sparkles-rdf-client-*.tgz; do
            [ -f "$package" ] || continue
            spec=$(tar -xOzf "$package" package/package.json | node -e 'const p = JSON.parse(require("fs").readFileSync(0)); console.log(p.name + "@" + p.version)')
            # A rerun after a partial failure skips what is already published.
            if npm view "$spec" version > /dev/null 2>&1; then
              echo "$spec is already published"
              continue
            fi
            npm publish "$package" --access public --provenance
          done
