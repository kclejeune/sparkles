# The Rust workspace's checks on every push and pull request: formatting (the workspace and
# the binding crates, which are their own workspaces), Clippy with warnings as errors over
# all targets, the workspace tests, and the checked-in OpenAPI description. The server
# embeds ui/build, and its build script writes a placeholder page when the UI is missing,
# so these jobs do not build the UI. The W3C, SHACL and ShEx conformance suites need
# local checkouts of the test files and skip themselves here. `mise run ci` runs the
# rest (the UI, the bindings, feature combinations and license notices).
#
# The jobs run on standard GitHub-hosted runners and cache Cargo dependencies in the
# GitHub Actions cache (docs/DEVELOPMENT.md, "Continuous integration").
name: Rust

# A branch with a pull request runs once (for the pull request), not also for its pushes,
# and changes that cannot affect the Rust build do not run it at all.
on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "docs/specs/**"
      - "docs/images/**"
      - "docs/benchmarks/**"
      - "ui/**"
      - "js/**"
      - "jvm/**"
      - ".github/workflows/python-wheels.yml"
      - ".github/workflows/node-packages.yml"
      - ".github/workflows/jvm-bindings.yml"
  pull_request:
    paths-ignore:
      - "README.md"
      - "docs/specs/**"
      - "docs/images/**"
      - "docs/benchmarks/**"
      - "ui/**"
      - "js/**"
      - "jvm/**"
      - ".github/workflows/python-wheels.yml"
      - ".github/workflows/node-packages.yml"
      - ".github/workflows/jvm-bindings.yml"
  # A manual run can also test Linux arm64 and macOS on Apple silicon, for example before
  # a release. Pushes and pull requests test Linux x86_64 only.
  workflow_dispatch:
    inputs:
      all-platforms:
        description: Also run the tests on Linux arm64 and macOS arm64
        type: boolean
        default: false

permissions:
  contents: read

# A newer push supersedes a running check of the same branch, including main.
concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  # One job per platform. Formatting is platform independent and runs once;
  # Clippy runs on every platform because cfg-gated
  # code differs between them. After a formatting or Clippy failure the remaining steps
  # still run, so one push reports everything, and a cancelled run stops.
  check:
    timeout-minutes: 60
    name: Check (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.all-platforms && '["linux-amd64", "linux-arm64", "macos-arm64"]' || '["linux-amd64"]') }}
    runs-on: ${{ matrix.platform == 'macos-arm64' && 'macos-15' || matrix.platform == 'linux-arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v5
      # installs the toolchain, components and targets that rust-toolchain.toml pins; the
      # cache action below caches Cargo, and no RUSTFLAGS are added, as in local builds
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with: { cache: false, rustflags: "" }
      # Formatting compiles nothing, so it runs before the dependency cache is restored.
      - name: cargo fmt
        if: matrix.platform == 'linux-amd64'
        run: |
          cargo fmt --all --check
          cargo fmt --manifest-path crates/sparkles-py/Cargo.toml --check
          cargo fmt --manifest-path crates/sparkles-ffi/Cargo.toml --check
          cargo fmt --manifest-path crates/sparkles-node/Cargo.toml --check
      - if: ${{ !cancelled() }}
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.platform }}
      - name: cargo clippy
        if: ${{ !cancelled() }}
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - if: ${{ !cancelled() }}
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.146
      # The settings in .config/nextest.toml: every failure reported at the end, and a
      # test that runs past ten minutes stopped. nextest does not run doctests. The suite
      # includes openapi::tests::checked_in_copy_is_current, which fails when
      # docs/openapi.json is out of date.
      - name: cargo nextest
        if: ${{ !cancelled() }}
        run: cargo nextest run --locked --workspace --profile ci
      - name: Doctests
        if: ${{ !cancelled() }}
        run: cargo test --locked --workspace --doc
