# Wheels and the source distribution of the Python bindings (crates/sparkles-py, the
# `sparkles-rdf` distribution). Each job builds an abi3 wheel with maturin-action, installs
# it, runs the pytest suite against the installation (scripts/py-wheel-test.sh), and
# uploads it as an artifact. The publish job runs only for a `py-v*` tag, and only when
# the repository variable PYPI_PUBLISH is "true" and PyPI trusted publishing is set up for
# the `pypi` environment (docs/DEVELOPMENT.md). Until then the workflow builds and tests,
# and publishes nothing.
#
# Wheels are built for Linux on x86_64 and arm64 (manylinux and musllinux) and for macOS
# on Apple silicon. The jobs run on standard GitHub-hosted runners with build
# dependencies cached in GitHub Actions.
name: Python wheels

# Pushes to main and pull requests run when the Python bindings or a crate they build on
# changes. Shared patch fixtures also run the wheel tests that read them. Other crates'
# tests, benches and examples do not change the wheel.
on:
  push:
    branches: [main]
    tags: ["py-v*"]
    paths: &paths
      - "crates/sparkles/**"
      - "crates/sparkles-alloc/**"
      - "crates/sparkles-backup/**"
      - "crates/sparkles-core/**"
      - "crates/sparkles-graphql/**"
      - "crates/sparkles-py/**"
      - "crates/sparkles-reasoner/**"
      - "crates/sparkles-shacl/**"
      - "crates/sparkles-shex/**"
      - "!crates/sparkles*/tests/**"
      - "crates/sparkles-py/tests/**"
      - "crates/sparkles-core/tests/patch/**"
      - "!crates/sparkles*/benches/**"
      - "!crates/sparkles*/examples/**"
      - "vendor/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "scripts/install-mbx-container.sh"
      - "mise.toml"
      - "scripts/py-sdist.py"
      - "scripts/py-wheel-test.sh"
      - ".github/workflows/python-wheels.yml"
  pull_request:
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

# Main runs have distinct groups so neither running nor pending checks are superseded.
# Pull request updates supersede earlier checks; tag runs are never cancelled.
concurrency:
  group: python-wheels-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.run_id || 'latest' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref_type != 'tag' }}

env:
  MBX_HTTP_TIMEOUT: 5m
  # Only same-repository PRs may publish to the remote cache.
  MBX_REMOTE_TRUST_WRITES: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && 'true' || 'false' }}
  MATURIN_VERSION: "1.15.0"
  MANIFEST: crates/sparkles-py/Cargo.toml
  # Pushes to main and pull requests build the wheels in the dev profile, which compiles
  # far faster than the release profile's thin LTO; tags and manual runs build what would
  # be published.
  PROFILE_ARG: ${{ github.ref_type == 'branch' && github.event_name != 'workflow_dispatch' && '--profile dev' || '--release' }}

jobs:
  linux:
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 45
    name: Linux ${{ matrix.libc }} ${{ matrix.target }}
    # arm64 builds and tests natively on arm64 runners
    # Pushes to main and pull requests build and test the x86_64 manylinux wheel only. Tags
    # and manual runs build every wheel.
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64, aarch64]
        libc: [manylinux, musllinux]
        exclude:
          - target: ${{ github.ref_type == 'branch' && github.event_name != 'workflow_dispatch' && 'aarch64' || 'none' }}
          - libc: ${{ github.ref_type == 'branch' && github.event_name != 'workflow_dispatch' && 'musllinux' || 'none' }}
    env:
      CARGO_HOME: ${{ github.workspace }}/.cache/cargo
      MBX_CACHE_DIR: ${{ github.workspace }}/.cache/mbx
      COMPAT: ${{ matrix.libc == 'manylinux' && '2_28' || 'musllinux_1_2' }}
    runs-on: ${{ matrix.target == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v5
      # The container and host action share one job store. Its object payload
      # includes every binding compilation, independently of target placement.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with: { cache: false, rustflags: "" }
      - uses: jdx/mr-boxington-action@v1.7.3
        with:
          # Fork pull requests use GitHub cache because they cannot request an OIDC token.
          backend: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) && 'remote' || 'github' }}
          remote-url: https://mbx.kclj.dev
          namespace: kclejeune/sparkles
          oidc-audience: https://mbx.kclj.dev
          version: 1.28.0
          github-cache-mode: objects
          cache-generation: sparkles-python-linux-${{ matrix.libc }}-${{ env.PROFILE_ARG }}-v1
          save-on-workflow-dispatch: ${{ github.ref == 'refs/heads/main' }}
      - name: Build the wheel
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          target: ${{ matrix.target }}
          manylinux: ${{ env.COMPAT }}
          docker-options: >-
            -e MBX_CACHE_EXPORT_GROUP
            -e MBX_REMOTE_URL -e MBX_REMOTE_NAMESPACE -e MBX_REMOTE_OIDC_AUDIENCE
            -e MBX_REMOTE_TRUST_WRITES -e MBX_HTTP_TIMEOUT
            -e ACTIONS_ID_TOKEN_REQUEST_URL -e ACTIONS_ID_TOKEN_REQUEST_TOKEN
            -e GITHUB_ACTIONS -e GITHUB_EVENT_NAME -e GITHUB_REF -e GITHUB_REF_TYPE -e GITHUB_REF_PROTECTED
            -e MBX_CACHE_DIR=${{ github.workspace }}/.cache/mbx
            -e MBX_SHIMS_DIR=${{ github.workspace }}/.cache/container-shims
            -e CI=true
          # Maturin first bootstraps Rust with its default Cargo home. Switch
          # only the build's downloads after that bootstrap has completed.
          before-script-linux: |
            export CARGO_HOME="$GITHUB_WORKSPACE/.cache/cargo"
            source scripts/install-mbx-container.sh
          args: ${{ env.PROFILE_ARG }} --locked --manifest-path ${{ env.MANIFEST }} --target-dir target --out dist
      - name: Restore host ownership of container cache files
        if: always()
        run: |
          if [ -d .cache ]; then sudo chown -R "$(id -u):$(id -g)" .cache; fi
      - name: Set up CPython 3.10 and 3.14
        if: matrix.libc == 'manylinux'
        uses: actions/setup-python@v6
        with:
          python-version: |
            3.10
            3.14
      - name: Test the wheel on CPython 3.10 and 3.14
        if: matrix.libc == 'manylinux'
        run: scripts/py-wheel-test.sh dist/*.whl python3.10 python3.14
      - name: Test the wheel in Alpine
        if: matrix.libc == 'musllinux'
        run: |
          docker run --rm -v "$PWD:/io" -w /io python:3.13-alpine \
            sh -c "apk add --no-cache bash > /dev/null && scripts/py-wheel-test.sh dist/*.whl python3"
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.libc }}-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  macos:
    timeout-minutes: 45
    name: macOS arm64
    # tags and manual runs only
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    env:
      # the oldest macOS the wheels support (spec P01, §2.4)
      MACOSX_DEPLOYMENT_TARGET: "11.0"
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with: { cache: false, rustflags: "" }
      - uses: jdx/mr-boxington-action@v1.7.3
        with:
          version: 1.28.0
          github-cache-mode: objects
          cache-generation: sparkles-python-${{ env.PROFILE_ARG }}-v1
          save-on-workflow-dispatch: ${{ github.ref == 'refs/heads/main' }}
      # This build tool invokes Cargo itself.
      - name: Route build-tool Cargo calls through Boxington
        shell: bash
        run: |
          mbx setup --yes
          case "$RUNNER_OS" in
            Linux) printf '%s\n' "${XDG_DATA_HOME:-$HOME/.local/share}/mbx/bin" >> "$GITHUB_PATH" ;;
            macOS) printf '%s\n' "$HOME/Library/Application Support/mbx/bin" >> "$GITHUB_PATH" ;;
          esac
      - name: Set up CPython 3.10 and 3.14
        uses: actions/setup-python@v6
        with:
          python-version: |
            3.10
            3.14
      - name: Build the wheel
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          target: aarch64
          args: ${{ env.PROFILE_ARG }} --locked --manifest-path ${{ env.MANIFEST }} --out dist
      - name: Test the wheel on CPython 3.10 and 3.14
        run: scripts/py-wheel-test.sh dist/*.whl python3.10 python3.14
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-aarch64
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    timeout-minutes: 45
    name: Source distribution
    # tags and manual runs only
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with: { cache: false, rustflags: "" }
      - uses: jdx/mr-boxington-action@v1.7.3
        with:
          version: 1.28.0
          github-cache-mode: objects
          cache-generation: sparkles-python-sdist-v1
          save-on-workflow-dispatch: ${{ github.ref == 'refs/heads/main' }}
      # This build tool invokes Cargo itself.
      - name: Route build-tool Cargo calls through Boxington
        shell: bash
        run: |
          mbx setup --yes
          case "$RUNNER_OS" in
            Linux) printf '%s\n' "${XDG_DATA_HOME:-$HOME/.local/share}/mbx/bin" >> "$GITHUB_PATH" ;;
            macOS) printf '%s\n' "$HOME/Library/Application Support/mbx/bin" >> "$GITHUB_PATH" ;;
          esac
      - name: Set up CPython 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Build the sdist
        run: |
          pip install --quiet "maturin==$MATURIN_VERSION"
          python scripts/py-sdist.py dist
      - name: Build a wheel from the sdist and test it, as `pip install sparkles-rdf` would
        run: scripts/py-wheel-test.sh dist/*.tar.gz python3.14
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    timeout-minutes: 15
    name: Publish to PyPI
    needs: [linux, macos, sdist]
    # a release tag, and publishing switched on for the repository
    if: startsWith(github.ref, 'refs/tags/py-v') && vars.PYPI_PUBLISH == 'true'
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/sparkles-rdf
    permissions:
      # PyPI trusted publishing (OpenID Connect): no API token is stored
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - name: Check that the tag names the crate's version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' crates/sparkles-py/Cargo.toml | head -1)
          if [ "$GITHUB_REF_NAME" != "py-v$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match the version $version" >&2
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # Trusted publishing when the PYPI_API_TOKEN secret is unset; a PyPI pending
      # publisher lets the first release create the project without a token. A rerun
      # skips files that are already on PyPI.
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true
