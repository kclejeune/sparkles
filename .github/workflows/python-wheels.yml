# Wheels and the source distribution of the Python bindings (crates/sparkles-py, the
# `sparkles-rdf` distribution). Each job builds an abi3 wheel with maturin-action, installs
# it, runs the pytest suite against the installation (scripts/py-wheel-test.sh), and
# uploads it as an artifact. The publish job runs only for a `py-v*` tag, and only when
# the repository variable PYPI_PUBLISH is "true" and PyPI trusted publishing is set up for
# the `pypi` environment (docs/DEVELOPMENT.md). Until then the workflow builds and tests,
# and publishes nothing.
#
# Wheels are built for Linux on x86_64 and arm64 (manylinux and musllinux) and for macOS
# on Apple silicon. The jobs run on Namespace runners with a cache volume per platform,
# shared with the other workflows and written back only from main.
name: Python wheels

on:
  push:
    tags: ["py-v*"]
  pull_request:
    paths:
      - "crates/**"
      - "vendor/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "scripts/py-sdist.py"
      - "scripts/py-wheel-test.sh"
      - ".github/workflows/python-wheels.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-wheels-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  MATURIN_VERSION: "1.15.0"
  MANIFEST: crates/sparkles-py/Cargo.toml
  # Pull requests build the wheels in the dev profile, which compiles far faster than the
  # release profile's thin LTO; tags and manual runs build what would be published.
  PROFILE_ARG: ${{ github.event_name == 'pull_request' && '--profile dev' || '--release' }}

jobs:
  linux:
    timeout-minutes: 45
    name: Linux ${{ matrix.libc }} ${{ matrix.target }}
    # arm64 builds and tests natively on arm64 runners
    # Pull requests build and test the x86_64 manylinux wheel only. Tags and manual runs
    # build every wheel.
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64, aarch64]
        libc: [manylinux, musllinux]
        exclude:
          - target: ${{ github.event_name == 'pull_request' && 'aarch64' || 'none' }}
          - libc: ${{ github.event_name == 'pull_request' && 'musllinux' || 'none' }}
    env:
      COMPAT: ${{ matrix.libc == 'manylinux' && '2_28' || 'musllinux_1_2' }}
    runs-on:
      - nscloud-ubuntu-24.04-${{ matrix.target == 'aarch64' && 'arm64' || 'amd64' }}-8x16-with-cache
      - nscloud-cache-tag-sparkles-linux-${{ matrix.target == 'aarch64' && 'arm64' || 'amd64' }}
      - nscloud-cache-size-50gb
      - nscloud-cache-allow-commit-from-main
      - nscloud-git-mirror-5gb
    steps:
      - uses: namespacelabs/nscloud-checkout-action@v8
      # maturin builds in a manylinux or musllinux container with the workspace mounted,
      # so the cached target directory carries over between runs.
      - uses: namespacelabs/nscloud-cache-action@v1
        with:
          path: target
      - name: Build the wheel
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          target: ${{ matrix.target }}
          manylinux: ${{ env.COMPAT }}
          args: ${{ env.PROFILE_ARG }} --locked --manifest-path ${{ env.MANIFEST }} --out dist
      - name: Set up CPython 3.10 and 3.14
        if: matrix.libc == 'manylinux'
        uses: actions/setup-python@v6
        with:
          python-version: |
            3.10
            3.14
      - name: Test the wheel on CPython 3.10 and 3.14
        if: matrix.libc == 'manylinux'
        run: scripts/py-wheel-test.sh dist/*.whl python3.10 python3.14
      - name: Test the wheel in Alpine
        if: matrix.libc == 'musllinux'
        run: |
          docker run --rm -v "$PWD:/io" -w /io python:3.13-alpine \
            sh -c "apk add --no-cache bash > /dev/null && scripts/py-wheel-test.sh dist/*.whl python3"
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.libc }}-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  macos:
    timeout-minutes: 45
    name: macOS arm64
    # tags and manual runs only
    if: github.event_name != 'pull_request'
    runs-on:
      - nscloud-macos-sequoia-arm64-6x14-with-cache
      - nscloud-cache-tag-sparkles-macos-arm64
      - nscloud-cache-size-50gb
      - nscloud-cache-allow-commit-from-main
      - nscloud-git-mirror-5gb
    env:
      # the oldest macOS the wheels support (spec P01, §2.4)
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: namespacelabs/nscloud-checkout-action@v8
      # installs the toolchain, components and targets that rust-toolchain.toml pins; the
      # cache action below caches Cargo, and no RUSTFLAGS are added, as in local builds
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with: { cache: false, rustflags: "" }
      - uses: namespacelabs/nscloud-cache-action@v1
        with:
          cache: rust
      - name: Set up CPython 3.10 and 3.14
        uses: actions/setup-python@v6
        with:
          python-version: |
            3.10
            3.14
      - name: Build the wheel
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          target: aarch64
          args: ${{ env.PROFILE_ARG }} --locked --manifest-path ${{ env.MANIFEST }} --out dist
      - name: Test the wheel on CPython 3.10 and 3.14
        run: scripts/py-wheel-test.sh dist/*.whl python3.10 python3.14
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-aarch64
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    timeout-minutes: 45
    name: Source distribution
    runs-on:
      - nscloud-ubuntu-24.04-amd64-8x16-with-cache
      - nscloud-cache-tag-sparkles-linux-amd64
      - nscloud-cache-size-50gb
      - nscloud-cache-allow-commit-from-main
      - nscloud-git-mirror-5gb
    steps:
      - uses: namespacelabs/nscloud-checkout-action@v8
      # installs the toolchain, components and targets that rust-toolchain.toml pins; the
      # cache action below caches Cargo, and no RUSTFLAGS are added, as in local builds
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with: { cache: false, rustflags: "" }
      - uses: namespacelabs/nscloud-cache-action@v1
        with:
          cache: rust
      - name: Set up CPython 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Build the sdist
        run: |
          pip install --quiet "maturin==$MATURIN_VERSION"
          python scripts/py-sdist.py dist
      - name: Build a wheel from the sdist and test it, as `pip install sparkles-rdf` would
        run: scripts/py-wheel-test.sh dist/*.tar.gz python3.14
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    timeout-minutes: 15
    name: Publish to PyPI
    needs: [linux, macos, sdist]
    # a release tag, and publishing switched on for the repository
    if: startsWith(github.ref, 'refs/tags/py-v') && vars.PYPI_PUBLISH == 'true'
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/sparkles-rdf
    permissions:
      # PyPI trusted publishing (OpenID Connect): no API token is stored
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - name: Check that the tag names the crate's version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' crates/sparkles-py/Cargo.toml | head -1)
          if [ "$GITHUB_REF_NAME" != "py-v$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match the version $version" >&2
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # Trusted publishing when the PYPI_API_TOKEN secret is unset; a PyPI pending
      # publisher lets the first release create the project without a token. A rerun
      # skips files that are already on PyPI.
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true
