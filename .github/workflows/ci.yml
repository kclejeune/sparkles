# The main checks on every push to main and every pull request (docs/DEVELOPMENT.md,
# "Continuous integration"). The jobs run in parallel, so a push waits for the longest
# chain, which is the test build followed by one test shard. They run on standard
# GitHub-hosted runners unless the repository variables SPARKLES_RUNNER_LARGE (the
# compile-heavy jobs) and SPARKLES_RUNNER (the test shards, the doctests and the checks)
# name another runner label. Fork pull requests always use GitHub's runners.
#
# mbx builds in local mode with no remote cache. Swatinem/rust-cache carries the Cargo
# registry and the dependencies' part of the target directory between runs. Clippy keeps
# one cache and the test build another, which the doctests and the feature jobs restore.
# Main pushes save a cache when its key is new, and other runs only restore.
#
#   checks       formatting of Rust, UI, JavaScript and shell, shellcheck, cited doc
#                paths, the benchmark scripts' tests, the UI's type check, unit tests and
#                build, the license notices and the generated TypeScript client; no
#                Rust build
#   clippy       Clippy with warnings as errors on the workspace, the formatter's
#                WebAssembly build and the three binding crates
#   build        the workspace's tests built once into nextest archives
#   doctests     the workspace's doctests, which nextest does not run
#   test         the archive's tests in shards, with the W3C SPARQL and RDF, SHACL,
#                ShEx and JSON-LD suites fetched at pinned commits
#   jena-clients Apache Jena's own HTTP clients against the debug server binary
#   features     an opt-in manual compatibility matrix with the server defaults off
#                and one optional feature set on, built apart from the archive
#
# A manual run can also test Linux arm64 and macOS on Apple silicon, for example before
# a release. The server embeds ui/build, and its build script writes a placeholder page
# when the UI is missing, so the Rust jobs do not build the UI.
name: CI

# A branch with a pull request runs once (for the pull request), not also for its pushes,
# and changes that cannot affect these checks do not run them at all.
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/images/**"
      - "docs/benchmarks/**"
      - "jvm/**"
      - ".github/workflows/python-wheels.yml"
      - ".github/workflows/node-packages.yml"
      - ".github/workflows/jvm-bindings.yml"
  pull_request:
    paths-ignore:
      - "docs/images/**"
      - "docs/benchmarks/**"
      - "jvm/**"
      - ".github/workflows/python-wheels.yml"
      - ".github/workflows/node-packages.yml"
      - ".github/workflows/jvm-bindings.yml"
  workflow_dispatch:
    inputs:
      compatibility-features:
        description: Also test the six stripped-server feature sets
        type: boolean
        default: false
      all-platforms:
        description: Also run Clippy and the tests on Linux arm64 and macOS arm64
        type: boolean
        default: false
      github-hosted:
        description: Use GitHub's runners even when the runner variables are set
        type: boolean
        default: false

permissions:
  contents: read

# Main runs have distinct groups so neither running nor pending checks are superseded.
# Pull request updates supersede earlier checks.
concurrency:
  group: ci-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.run_id || 'latest' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # The target is a plain directory in the checkout, which rust-cache saves and restores,
  # rather than a view into mbx's store.
  MBX_TARGET_VIEWS: "0"
  # The saved mbx stores stay small enough for GitHub's 10 GB repository cache.
  MBX_GC_MAX_SIZE: 3GiB
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  NEXTEST_VERSION: "0.9.146"
  # The test binaries with the slowest tests, which run in two shards of their own, and the
  # `timing` group of .config/nextest.toml, which runs alone. These three shards use a small
  # archive of HEAVY_1, HEAVY_2 and TIMING_BINARIES. The other tests are split by count
  # over the remaining shards. Each regular expression must match a binary, or nextest
  # refuses the filter. A new test in the timing group needs its binary in TIMING_BINARIES.
  HEAVY_1: binary_id(/^(sparkles-core::(spill_join|power_loss|w3c|geo_join)|sparkles-fmt::w3c_turtle)$/)
  HEAVY_2: binary_id(/^(sparkles-core::query_cursor|sparkles-reasoner::(explain_demand|demand)|sparkles-fmt::turtle_stream)$/)
  TIMING: test(planning_at_the_limit_stops_at_the_timeout) | test(a_large_json_ld_document_keeps_to_a_short_deadline)
  TIMING_BINARIES: binary_id(/^(sparkles::nesting|sparkles-fmt)$/)

jobs:
  # Whether the change can affect the Rust jobs. Changes only to the UI, the JavaScript
  # packages, the README or the specs run the checks job alone. A manual run runs all.
  changes:
    name: Changes
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.rust == 'true' }}
      shards: ${{ steps.shards.outputs.shards }}
    steps:
      # The two heavy shards, the timing shard and SPARKLES_TEST_SLICES shards (default
      # four) that split the other tests by count.
      - name: Test shards
        id: shards
        env:
          SLICES: ${{ vars.SPARKLES_TEST_SLICES || '4' }}
        run: |
          case "$SLICES" in
            [1-9] | 1[0-6]) ;;
            *) echo "SPARKLES_TEST_SLICES must be a number from 1 to 16, not '$SLICES'" >&2; exit 1 ;;
          esac
          shards='"heavy-1","heavy-2","timing"'
          for i in $(seq 1 "$SLICES"); do shards="$shards,\"$i/$SLICES\""; done
          echo "shards=[$shards]" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # a file counts when it matches every pattern, that is, none of the exclusions
          predicate-quantifier: every
          filters: |
            rust:
              - "**"
              - "!README.md"
              - "!docs/specs/**"
              - "!ui/**"
              - "!js/**"

  # The checks that need no Rust build. Every step runs even after an earlier one fails,
  # so one push reports every problem, and a cancelled run stops.
  checks:
    name: Checks
    timeout-minutes: 20
    # SPARKLES_RUNNER for same-repository events, GitHub's runner otherwise
    runs-on: &runner ${{ !inputs.github-hosted && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.SPARKLES_RUNNER || 'ubuntu-24.04' }}
    steps:
      # The fixed bootstrap source and trusted base need complete ancestry proof.
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      # rustfmt for the formatting check and rustc for the crash harness's tests
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with: { cache: false, rustflags: "" }
      # node, pnpm, shfmt and shellcheck at the versions mise.toml pins
      - uses: jdx/mise-action@v5
        with:
          install_args: node pnpm shfmt shellcheck mr-boxington
      - name: mbx fmt
        if: ${{ !cancelled() }}
        run: |
          mbx fmt --all --check
          mbx fmt --manifest-path crates/sparkles-py/Cargo.toml --check
          mbx fmt --manifest-path crates/sparkles-ffi/Cargo.toml --check
          mbx fmt --manifest-path crates/sparkles-node/Cargo.toml --check
      - name: shfmt and shellcheck
        if: ${{ !cancelled() }}
        run: mise run lint:shell
      - name: Cited doc paths (mise run lint:doc-paths)
        if: ${{ !cancelled() }}
        run: python3 scripts/check-doc-paths.py --code
      - name: API compatibility inventory and fixtures
        if: ${{ !cancelled() }}
        env:
          API_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # BEGIN API EVENT BASE FETCH
          if [ -n "$API_BASE_REF" ]; then
            if [[ ! $API_BASE_REF =~ ^[0-9a-f]{40}$ ]]; then
              echo 'API base revision must be an explicit full commit hash' >&2
              exit 2
            fi
            if ! git cat-file -e "$API_BASE_REF^{commit}" 2>/dev/null; then
              git fetch --no-tags origin "$API_BASE_REF"
            fi
          fi
          # END API EVENT BASE FETCH
          mise run api:check
          if [ -n "$API_BASE_REF" ]; then
            python3 scripts/api-compat.py --check-manifest --base-ref "$API_BASE_REF"
          fi
      - name: Benchmark scripts and crash harness (mise run test:bench-scripts)
        if: ${{ !cancelled() }}
        run: |
          python3 -m unittest discover -s scripts/bench-tests
          rustc --edition 2024 --test -o "$RUNNER_TEMP/crash-harness-test" scripts/crash-harness.rs
          "$RUNNER_TEMP/crash-harness-test"
      - name: Crate license notices
        if: ${{ !cancelled() }}
        run: python3 scripts/third-party-licenses.py --check
      - name: Install UI and JavaScript dependencies
        if: ${{ !cancelled() }}
        run: |
          pnpm --dir ui install --frozen-lockfile
          pnpm --dir js install --frozen-lockfile
      - name: UI formatting
        if: ${{ !cancelled() }}
        run: pnpm --dir ui format:check
      - name: JavaScript formatting
        if: ${{ !cancelled() }}
        run: pnpm --dir js format:check
      - name: TypeScript client matches docs/openapi.json
        if: ${{ !cancelled() }}
        run: pnpm --dir js client:check
      - name: UI build and license notices
        if: ${{ !cancelled() }}
        run: |
          pnpm --dir ui build
          cmp ui/build/licenses.txt THIRD_PARTY_LICENSES-UI.md || {
            echo 'THIRD_PARTY_LICENSES-UI.md is out of date: run mise run licenses' >&2
            exit 1
          }
      # after the build, since both regenerate ui/.svelte-kit
      - name: UI type check (svelte-check)
        if: ${{ !cancelled() }}
        run: pnpm --dir ui check
      - name: UI unit tests (Vitest)
        if: ${{ !cancelled() }}
        run: pnpm --dir ui test

  # Clippy runs on every platform of a run because cfg-gated code differs between them.
  # The binding crates are their own workspaces and share the target directory, so they
  # reuse most of the workspace's checked dependencies.
  clippy:
    name: Clippy (${{ matrix.platform }})
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.all-platforms && '["linux-amd64", "linux-arm64", "macos-arm64"]' || '["linux-amd64"]') }}
    # Linux amd64 uses SPARKLES_RUNNER_LARGE for same-repository events.
    runs-on: ${{ matrix.platform == 'macos-arm64' && 'macos-15' || matrix.platform == 'linux-arm64' && 'ubuntu-24.04-arm' || !inputs.github-hosted && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.SPARKLES_RUNNER_LARGE || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with: { cache: false, rustflags: "" }
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          shared-key: clippy-${{ matrix.platform }}
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/lane/ci-speed-v2' }}
          # the binding crates are workspaces of their own that share the root target
          workspaces: |
            . -> target
            crates/sparkles-py -> ../../target
            crates/sparkles-ffi -> ../../target
            crates/sparkles-node -> ../../target
      # The server's build script writes ui/build/index.html when it is missing, and the
      # write is newer than the build, so every later Cargo command in the job would build
      # the server and relink its tests again. The same placeholder, written first, avoids
      # that.
      - name: UI placeholder
        run: &ui-placeholder |
          if [ ! -e ui/build/index.html ]; then
            mkdir -p ui/build
            printf '%s' '<!doctype html><title>Sparkles</title><p>The UI has not been built. Run <code>pnpm -C ui install &amp;&amp; pnpm -C ui build</code> and rebuild the server.</p>' > ui/build/index.html
          fi
      # mbx's object store keeps the workspace crates' outputs by the hash of their inputs,
      # so a crate whose sources and dependencies did not change is not compiled again,
      # while Cargo's fingerprints in the restored target cover only the dependencies.
      # Main runs save the store under the commit, and other runs restore the latest.
      - uses: actions/cache/restore@v4
        id: mbx-store
        with:
          path: &mbx-store |
            ~/.cache/mbx
            !~/.cache/mbx/targets
          key: mbx-store-clippy-${{ matrix.platform }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: mbx-store-clippy-${{ matrix.platform }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-
      # local mode: no remote cache, and no link cache, which would add every test binary
      # to the saved store
      - uses: jdx/mr-boxington-action@v1.7.3
        with:
          backend: local
          version: 1.29.1
          cache-links: false
      - name: Disk space before Clippy
        run: df -h "$GITHUB_WORKSPACE"
      - name: Workspace
        run: mbx clippy --locked --workspace --all-targets -- -D warnings
      - name: Formatter for wasm32 (mise run fmt:wasm)
        if: ${{ !cancelled() && matrix.platform == 'linux-amd64' }}
        run: mbx clippy --locked -p sparkles-fmt-wasm --target wasm32-unknown-unknown -- -D warnings
      # node and the wasm-bindgen test runner at the versions mise.toml pins
      - uses: jdx/mise-action@v5
        if: ${{ !cancelled() && matrix.platform == 'linux-amd64' }}
        with:
          install_args: node github:wasm-bindgen/wasm-bindgen@0.2.130
      - name: Formatter entry points in node (mise run fmt:wasm)
        if: ${{ !cancelled() && matrix.platform == 'linux-amd64' }}
        env:
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
        run: >-
          mise exec node github:wasm-bindgen/wasm-bindgen@0.2.130 --
          mbx test --locked -p sparkles-fmt-wasm --target wasm32-unknown-unknown --test wasm_runtime
      - name: Bindings (mise run py:lint jvm:lint node:lint)
        if: ${{ !cancelled() && matrix.platform == 'linux-amd64' }}
        run: |
          for crate in sparkles-py sparkles-ffi sparkles-node; do
            for features in "" --no-default-features; do
              echo "::group::$crate $features"
              mbx clippy --locked --manifest-path "crates/$crate/Cargo.toml" --target-dir target --all-targets $features -- -D warnings
              echo "::endgroup::"
            done
          done
      - if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/lane/ci-speed-v2' }}
        uses: actions/cache/save@v4
        with:
          path: *mbx-store
          key: ${{ steps.mbx-store.outputs.cache-primary-key }}
      - name: Disk space after Clippy
        if: ${{ always() }}
        run: df -h "$GITHUB_WORKSPACE"

  # The tests are built once and archived, and the shards run the archives. The heavy and
  # timing shards get a second, small archive with only their binaries, so they skip most
  # of the download and extraction. The doctests run in a job of their own, so the shards
  # do not wait for them.
  build:
    name: Build tests
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    timeout-minutes: 45
    # SPARKLES_RUNNER_LARGE for same-repository events, GitHub's runner otherwise
    runs-on: ${{ !inputs.github-hosted && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.SPARKLES_RUNNER_LARGE || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v5
      # The build's target, the uncompressed archive, the final archives and the swap file
      # take about 40 GB. When the runner has less than 60 GiB free, unused preinstalled
      # toolchains are removed in the background during the setup steps. The test shards
      # use about 30 GB and the doctests about 15 GB.
      - name: Free disk space
        run: &free-disk scripts/ci-free-disk.sh start 60
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with: { cache: false, rustflags: "" }
      # The test build can exceed the physical memory of a 16 GB runner. A larger runner
      # needs no swap file, and a runner whose file system refuses one warns instead.
      - name: Add swap
        if: runner.os == 'Linux'
        shell: bash
        run: &add-swap |
          memory_kib=$(awk '/^MemTotal:/ { print $2 }' /proc/meminfo)
          if [ "$memory_kib" -ge $((24 * 1024 * 1024)) ]; then
            echo "$((memory_kib / 1024 / 1024)) GiB of memory, so no swap file"
            exit 0
          fi
          # A name of its own, so a persistent runner never touches another job's swap file
          swapfile="/swapfile-ci-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$GITHUB_JOB"
          if ! sudo fallocate -l 16G "$swapfile"; then
            echo '::warning::the runner refused a swap file'
          elif ! { sudo chmod 600 "$swapfile" && sudo mkswap "$swapfile" > /dev/null &&
            sudo swapon "$swapfile"; }; then
            echo '::warning::the runner refused a swap file'
            sudo rm -f "$swapfile" || true
          else
            echo "CI_SWAPFILE=$swapfile" >> "$GITHUB_ENV"
          fi
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          shared-key: tests
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/lane/ci-speed-v2' }}
      - name: UI placeholder
        run: *ui-placeholder
      - uses: actions/cache/restore@v4
        id: mbx-store
        with:
          path: *mbx-store
          key: mbx-store-tests-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: mbx-store-tests-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-
      # local mode: no remote cache, and no link cache, which would add every test binary
      # to the saved store
      - uses: jdx/mr-boxington-action@v1.7.3
        with:
          backend: local
          version: 1.29.1
          cache-links: false
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@${{ env.NEXTEST_VERSION }}
      # The test binaries are about 18 GB and share most of their code, which zstd finds
      # with a long window. nextest 0.9.146 cannot write one, so it writes its fastest level
      # and a second pass recompresses at level 1 with a 128 MB window (--long=27, the
      # largest nextest reads). That pass takes about a quarter of the time of level 6 and
      # gives a 2.7 GB archive instead of 2.3 GB. The server's build script writes a
      # placeholder ui/build, which debug builds read from disk at run time, so the shards
      # get it next to the archive. The Jena clients job gets the server binary alone.
      - name: Disk space before test archive
        run: &free-disk-wait scripts/ci-free-disk.sh wait
      # One managed-target lease (scripts/cargo-sparkles-task) covers both archive commands
      # and the copy of the server binary. Without it Boxington collects the target after
      # the first command, and the second rebuilds the workspace.
      - name: Build the test archives
        run: |
          mkdir -p "$RUNNER_TEMP/archive" "$RUNNER_TEMP/heavy" "$RUNNER_TEMP/server"
          # shellcheck disable=SC2016 # the inner shell expands the variables
          PATH="$PWD/scripts:$PATH" mbx sparkles-task -- bash -euo pipefail -c '
            mbx nextest archive --locked --workspace --zstd-level -7 --archive-file "$RUNNER_TEMP/raw.tar.zst"
            mbx nextest archive --locked --workspace -E "$HEAVY_1 | $HEAVY_2 | $TIMING_BINARIES" --zstd-level 3 \
              --archive-file "$RUNNER_TEMP/heavy/tests.tar.zst"
            tar --zstd -cf "$RUNNER_TEMP/server/sparkles.tar.zst" target/debug/sparkles
          '
          zstd -q -d -c "$RUNNER_TEMP/raw.tar.zst" | zstd -q -1 -T0 --long=27 -o "$RUNNER_TEMP/archive/tests.tar.zst"
          rm "$RUNNER_TEMP/raw.tar.zst"
          tar -cf "$RUNNER_TEMP/archive/ui-build.tar" ui/build
          cp "$RUNNER_TEMP/archive/ui-build.tar" "$RUNNER_TEMP/heavy/"
          echo "$GITHUB_WORKSPACE" > "$RUNNER_TEMP/archive/build-workspace"
          cp "$RUNNER_TEMP/archive/build-workspace" "$RUNNER_TEMP/heavy/"
          ls -l "$RUNNER_TEMP"/archive/* "$RUNNER_TEMP"/heavy/* "$RUNNER_TEMP"/server/*
      - if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/lane/ci-speed-v2' }}
        uses: actions/cache/save@v4
        with:
          path: *mbx-store
          key: ${{ steps.mbx-store.outputs.cache-primary-key }}
      - name: Disk space after test archive
        if: ${{ always() }}
        run: &free-disk-report scripts/ci-free-disk.sh report
      # A persistent runner keeps the machine, so the job removes its own swap file.
      - name: Remove swap
        if: ${{ always() && env.CI_SWAPFILE != '' }}
        run: &remove-swap |
          sudo swapoff "$CI_SWAPFILE" || true
          sudo rm -f "$CI_SWAPFILE" || true
      # The archives are zstd already.
      - uses: actions/upload-artifact@v4
        with:
          name: nextest-archive
          path: ${{ runner.temp }}/archive
          retention-days: 1
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: nextest-archive-heavy
          path: ${{ runner.temp }}/heavy
          retention-days: 1
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: server-debug
          path: ${{ runner.temp }}/server
          retention-days: 1
          compression-level: 0

  # nextest does not run doctests. They build the workspace's libraries again, from the
  # test build's dependency cache, in parallel with the test build.
  doctests:
    name: Doctests
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    timeout-minutes: 45
    runs-on: *runner
    steps:
      - uses: actions/checkout@v5
      # The same removal as in the test build, when the runner has less than 60 GiB free
      - name: Free disk space
        run: *free-disk
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with: { cache: false, rustflags: "" }
      - name: Add swap
        if: runner.os == 'Linux'
        shell: bash
        run: *add-swap
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          shared-key: tests
          save-if: false
      - uses: actions/cache/restore@v4
        id: mbx-store
        with:
          path: *mbx-store
          key: mbx-store-tests-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: mbx-store-tests-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-
      # local mode: no remote cache, and no link cache, which would add every test binary
      # to the saved store
      - uses: jdx/mr-boxington-action@v1.7.3
        with:
          backend: local
          version: 1.29.1
          cache-links: false
      - name: Disk space before doctests
        run: *free-disk-wait
      - name: Doctests
        run: mbx test --locked --workspace --doc
      - name: Disk space after doctests
        if: ${{ always() }}
        run: *free-disk-report
      - name: Remove swap
        if: ${{ always() && env.CI_SWAPFILE != '' }}
        run: *remove-swap

  # Each shard runs a part of the tests from an archive. The settings come from
  # .config/nextest.toml: every failure reported at the end, the slowest tests started
  # first, and a test that runs past ten minutes stopped. The suite includes
  # openapi::tests::checked_in_copy_is_current, which fails when docs/openapi.json is out
  # of date.
  #
  # heavy-1 and heavy-2 run the binaries in HEAVY_1 and HEAVY_2. The numbered shards split
  # every other test by count. The tests of the `timing` group need the machine to
  # themselves, and one of them runs for about two minutes on a runner, which would stall
  # the shard it fell into, so they run in the timing shard. The filters together select
  # every test exactly once, as long as HEAVY_1 and HEAVY_2 share no binary.
  test:
    name: Test (${{ matrix.shard }})
    needs: [changes, build]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.changes.outputs.shards) }}
    runs-on: *runner
    steps:
      - uses: actions/checkout@v5
      # The same removal as in the test build, when the runner has less than 60 GiB free
      - name: Free disk space
        run: *free-disk
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@${{ env.NEXTEST_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          name: ${{ (startsWith(matrix.shard, 'heavy-') || matrix.shard == 'timing') && 'nextest-archive-heavy' || 'nextest-archive' }}
          path: ${{ runner.temp }}
      # shallow sparse checkouts of Apache Jena's and Oxigraph's test directories, about
      # 35 MB, which take a few seconds
      - name: Fetch the conformance suites
        run: scripts/fetch-test-suites.sh "$RUNNER_TEMP/test-suites" >> "$GITHUB_ENV"
      # cargo-nextest is called directly: the archive needs no Cargo, and calling cargo
      # would make rustup install the pinned toolchain first. The archive is extracted
      # into the checkout, where the build job's target directory was, because tests find
      # the server binary, the UI and their fixtures by paths fixed at compile time. When
      # the build ran on a runner with another checkout path, as when only one of the
      # runner variables is set, a link from that path leads to this checkout.
      - name: Wait for the free disk space
        run: *free-disk-wait
      - name: mbx nextest
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          # The link assumes one job at a time on the machine, as on ephemeral runners.
          build_workspace=$(cat "$RUNNER_TEMP/build-workspace")
          if [ "$build_workspace" != "$GITHUB_WORKSPACE" ]; then
            if [ -e "$build_workspace" ] && [ ! -L "$build_workspace" ]; then
              echo "the build's checkout path $build_workspace exists on this runner" >&2
              exit 1
            fi
            sudo mkdir -p "$(dirname "$build_workspace")"
            sudo ln -sfn "$GITHUB_WORKSPACE" "$build_workspace"
            echo "CI_WORKSPACE_LINK=$build_workspace" >> "$GITHUB_ENV"
          fi
          tar -xf "$RUNNER_TEMP/ui-build.tar"
          # A timing test outside TIMING_BINARIES runs in a numbered or heavy shard instead.
          timing="($TIMING_BINARIES) & ($TIMING)"
          case "$SHARD" in
            timing) select=(-E "$timing") ;;
            heavy-1) select=(-E "($HEAVY_1) & not ($timing)") ;;
            heavy-2) select=(-E "($HEAVY_2) & not ($timing)") ;;
            *) select=(-E "not ($timing) & not ($HEAVY_1) & not ($HEAVY_2)" --partition "slice:$SHARD") ;;
          esac
          cargo-nextest nextest run --archive-file "$RUNNER_TEMP/tests.tar.zst" \
            --workspace-remap . --extract-to . --profile ci "${select[@]}"
      - name: Disk space after the tests
        if: ${{ always() }}
        run: *free-disk-report
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ matrix.shard == 'timing' && 'timing' || strategy.job-index }}
          path: target/nextest/ci/junit.xml
          retention-days: 7
          if-no-files-found: ignore
      - name: Remove the checkout link
        if: ${{ always() && env.CI_WORKSPACE_LINK != '' }}
        run: sudo rm -f "$CI_WORKSPACE_LINK" || true

  # The server's unit and integration tests with the default features off and one feature
  # set on (scripts/test-features.sh, mise run test:features). The archive above builds
  # the default features only, so a test that assumes a feature's routes, or their absence,
  # would pass there and fail here. Each set compiles the whole server crate again, so the
  # sets are separate manual compatibility jobs that restore the test build's cache. Ordinary pushes and
  # pull requests validate the default server. A new set goes in the script's default
  # list and in this matrix.
  features:
    name: Features (${{ matrix.set }})
    needs: changes
    if: github.event_name == 'workflow_dispatch' && inputs.compatibility-features && needs.changes.outputs.rust == 'true'
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        set: [none, auth, mcp, memory, graphql, shacl]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      # The server's test build and the swap file take much of the free disk of GitHub's
      # runner image.
      - name: Free disk space
        run: *free-disk
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with: { cache: false, rustflags: "" }
      # The test build can exceed the runner's physical memory.
      - name: Add swap
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo fallocate -l 16G /swapfile-ci
          sudo chmod 600 /swapfile-ci
          sudo mkswap /swapfile-ci > /dev/null
          sudo swapon /swapfile-ci
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          shared-key: tests
          save-if: false
      - name: UI placeholder
        run: *ui-placeholder
      - uses: actions/cache/restore@v4
        id: mbx-store
        with:
          path: *mbx-store
          key: mbx-store-tests-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: mbx-store-tests-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-
      # local mode: no remote cache, and no link cache, which would add every test binary
      # to the saved store
      - uses: jdx/mr-boxington-action@v1.7.3
        with:
          backend: local
          version: 1.29.1
          cache-links: false
      # the script runs the tests under nextest when it is installed, which stops a test
      # that hangs
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@${{ env.NEXTEST_VERSION }}
      - name: Disk space before feature tests
        run: *free-disk-wait
      - name: Server tests with the feature set
        env:
          NEXTEST_PROFILE: ci
        run: scripts/test-features.sh "${{ matrix.set }}"
      - name: Disk space after feature tests
        if: ${{ always() }}
        run: *free-disk-report

  # Apache Jena's own HTTP clients (RDFConnectionRemote, RDFConnectionFuseki, GSP, DSP,
  # QueryExecHTTP, UpdateExecHTTP) and Fuseki admin calls against the debug server binary
  # that the build job uploads (mise run test:jena-clients). The job is short, so it stays
  # on GitHub's runner.
  jena-clients:
    name: Jena clients
    needs: build
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    env:
      JENA_VERSION: "6.2.0"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: server-debug
          path: ${{ runner.temp }}
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "21" }
      - uses: actions/cache@v4
        id: jena
        with:
          path: ${{ runner.temp }}/apache-jena-${{ env.JENA_VERSION }}
          key: apache-jena-${{ env.JENA_VERSION }}
      - name: Download Apache Jena
        if: steps.jena.outputs.cache-hit != 'true'
        run: curl -fsSL "https://archive.apache.org/dist/jena/binaries/apache-jena-$JENA_VERSION.tar.gz" | tar -xz -C "$RUNNER_TEMP"
      - name: Run Jena's clients against the server
        run: |
          tar -xf "$RUNNER_TEMP/sparkles.tar.zst" -C "$RUNNER_TEMP" --zstd target/debug/sparkles
          SPARKLES_BIN="$RUNNER_TEMP/target/debug/sparkles" \
          JENA_HOME="$RUNNER_TEMP/apache-jena-$JENA_VERSION" \
          JAVA="$(command -v java)" \
            scripts/test-jena-clients.sh

  # Linux arm64 and macOS on Apple silicon, for a manual run with all-platforms checked:
  # one job per platform that builds and runs the tests, with the conformance suites.
  other-platforms:
    name: Test (${{ matrix.platform }})
    if: inputs.all-platforms
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        platform: [linux-arm64, macos-arm64]
    runs-on: ${{ matrix.platform == 'macos-arm64' && 'macos-15' || 'ubuntu-24.04-arm' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with: { cache: false, rustflags: "" }
      # The test build can exceed the runner's physical memory.
      - name: Add swap
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo fallocate -l 16G /swapfile-ci
          sudo chmod 600 /swapfile-ci
          sudo mkswap /swapfile-ci > /dev/null
          sudo swapon /swapfile-ci
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          shared-key: tests-${{ matrix.platform }}
          save-if: false
      - name: UI placeholder
        run: *ui-placeholder
      # local mode: no remote cache, and no link cache, which would add every test binary
      # to the saved store
      - uses: jdx/mr-boxington-action@v1.7.3
        with:
          backend: local
          version: 1.29.1
          cache-links: false
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@${{ env.NEXTEST_VERSION }}
      - name: Fetch the conformance suites
        run: scripts/fetch-test-suites.sh "$RUNNER_TEMP/test-suites" >> "$GITHUB_ENV"
      - name: mbx nextest
        shell: bash
        run: |
          # Encrypted library tests opt in within this shell, lowering both limits.
          if [ "$RUNNER_OS" = macOS ]; then
            mbx test --locked -p sparkles-backup --features encryption --lib seal::memory::macos_tests::keys_require_explicit_process_preparation -- --exact
            ulimit -c 0
          fi
          mbx nextest run --locked --workspace --profile ci
      - name: Doctests
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          if [ "$RUNNER_OS" = macOS ]; then ulimit -c 0; fi
          mbx test --locked --workspace --doc
