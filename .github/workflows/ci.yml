# The main checks on every push to main and every pull request (docs/DEVELOPMENT.md,
# "Continuous integration"). The jobs run in parallel on standard GitHub-hosted runners,
# so a push waits for the longest chain, which is the test build followed by one test
# shard:
#
#   checks       formatting of Rust, UI, JavaScript and shell, shellcheck, cited doc
#                paths, the benchmark scripts' tests, the UI's type check, unit tests and
#                build, the license notices and the generated TypeScript client; no
#                Rust build
#   clippy       Clippy with warnings as errors on the workspace, the formatter's
#                WebAssembly build and the three binding crates
#   build        the workspace's tests built once into a nextest archive, and the doctests
#   test         the archive's tests in four shards, with the W3C SPARQL and RDF, SHACL,
#                ShEx and JSON-LD suites fetched at pinned commits
#   jena-clients Apache Jena's own HTTP clients against the server binary from the archive
#
# A manual run can also test Linux arm64 and macOS on Apple silicon, for example before
# a release. The server embeds ui/build, and its build script writes a placeholder page
# when the UI is missing, so the Rust jobs do not build the UI.
name: CI

# A branch with a pull request runs once (for the pull request), not also for its pushes,
# and changes that cannot affect these checks do not run them at all.
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/images/**"
      - "docs/benchmarks/**"
      - "jvm/**"
      - ".github/workflows/python-wheels.yml"
      - ".github/workflows/node-packages.yml"
      - ".github/workflows/jvm-bindings.yml"
  pull_request:
    paths-ignore:
      - "docs/images/**"
      - "docs/benchmarks/**"
      - "jvm/**"
      - ".github/workflows/python-wheels.yml"
      - ".github/workflows/node-packages.yml"
      - ".github/workflows/jvm-bindings.yml"
  workflow_dispatch:
    inputs:
      all-platforms:
        description: Also run Clippy and the tests on Linux arm64 and macOS arm64
        type: boolean
        default: false

permissions:
  contents: read

# A newer push supersedes a running check of the same branch, including main.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  NEXTEST_VERSION: "0.9.146"

jobs:
  # Whether the change can affect the Rust jobs. Changes only to the UI, the JavaScript
  # packages, the README or the specs run the checks job alone. A manual run runs all.
  changes:
    name: Changes
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.rust == 'true' }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # a file counts when it matches every pattern, that is, none of the exclusions
          predicate-quantifier: every
          filters: |
            rust:
              - "**"
              - "!README.md"
              - "!docs/specs/**"
              - "!ui/**"
              - "!js/**"

  # The checks that need no Rust build. Every step runs even after an earlier one fails,
  # so one push reports every problem, and a cancelled run stops.
  checks:
    name: Checks
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      # rustfmt for the formatting check and rustc for the crash harness's tests
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with: { cache: false, rustflags: "" }
      # node, pnpm, shfmt and shellcheck at the versions mise.toml pins
      - uses: jdx/mise-action@v5
        with:
          install_args: node pnpm shfmt shellcheck
      - name: cargo fmt
        if: ${{ !cancelled() }}
        run: |
          cargo fmt --all --check
          cargo fmt --manifest-path crates/sparkles-py/Cargo.toml --check
          cargo fmt --manifest-path crates/sparkles-ffi/Cargo.toml --check
          cargo fmt --manifest-path crates/sparkles-node/Cargo.toml --check
      - name: shfmt and shellcheck
        if: ${{ !cancelled() }}
        run: |
          git ls-files -z '*.sh' | xargs -0 shfmt --diff --indent 2 --case-indent --space-redirects
          git ls-files -z '*.sh' | xargs -0 shellcheck
      - name: Cited doc paths (mise run lint:doc-paths)
        if: ${{ !cancelled() }}
        run: python3 scripts/check-doc-paths.py --code
      - name: Benchmark scripts and crash harness (mise run test:bench-scripts)
        if: ${{ !cancelled() }}
        run: |
          python3 -m unittest discover -s scripts/bench-tests
          rustc --edition 2024 --test -o "$RUNNER_TEMP/crash-harness-test" scripts/crash-harness.rs
          "$RUNNER_TEMP/crash-harness-test"
      - name: Crate license notices
        if: ${{ !cancelled() }}
        run: python3 scripts/third-party-licenses.py --check
      - name: Install UI and JavaScript dependencies
        if: ${{ !cancelled() }}
        run: |
          pnpm --dir ui install --frozen-lockfile
          pnpm --dir js install --frozen-lockfile
      - name: UI formatting
        if: ${{ !cancelled() }}
        run: pnpm --dir ui format:check
      - name: JavaScript formatting
        if: ${{ !cancelled() }}
        run: pnpm --dir js format:check
      - name: TypeScript client matches docs/openapi.json
        if: ${{ !cancelled() }}
        run: pnpm --dir js client:check
      - name: UI build and license notices
        if: ${{ !cancelled() }}
        run: |
          pnpm --dir ui build
          cmp ui/build/licenses.txt THIRD_PARTY_LICENSES-UI.md || {
            echo 'THIRD_PARTY_LICENSES-UI.md is out of date: run mise run licenses' >&2
            exit 1
          }
      # after the build, since both regenerate ui/.svelte-kit
      - name: UI type check (svelte-check)
        if: ${{ !cancelled() }}
        run: pnpm --dir ui check
      - name: UI unit tests (Vitest)
        if: ${{ !cancelled() }}
        run: pnpm --dir ui test

  # Clippy runs on every platform of a run because cfg-gated code differs between them.
  # The binding crates are their own workspaces and share the target directory, so they
  # reuse most of the workspace's checked dependencies.
  clippy:
    name: Clippy (${{ matrix.platform }})
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.all-platforms && '["linux-amd64", "linux-arm64", "macos-arm64"]' || '["linux-amd64"]') }}
    runs-on: ${{ matrix.platform == 'macos-arm64' && 'macos-15' || matrix.platform == 'linux-arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: ${{ matrix.platform }}
          workspaces: |
            . -> target
            crates/sparkles-py -> ../../target
            crates/sparkles-ffi -> ../../target
            crates/sparkles-node -> ../../target
      - name: Workspace
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Formatter for wasm32 (mise run fmt:wasm)
        if: ${{ !cancelled() && matrix.platform == 'linux-amd64' }}
        run: cargo clippy --locked -p sparkles-fmt-wasm --target wasm32-unknown-unknown -- -D warnings
      - name: Bindings (mise run py:lint jvm:lint node:lint)
        if: ${{ !cancelled() && matrix.platform == 'linux-amd64' }}
        run: |
          for crate in sparkles-py sparkles-ffi sparkles-node; do
            for features in "" --no-default-features; do
              echo "::group::$crate $features"
              cargo clippy --locked --manifest-path "crates/$crate/Cargo.toml" --target-dir target --all-targets $features -- -D warnings
              echo "::endgroup::"
            done
          done

  # The tests are built once and archived, and the shards run the archive. nextest does
  # not run doctests, so they run here.
  build:
    name: Build tests
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    timeout-minutes: 45
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: tests
          swap: "true"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@${{ env.NEXTEST_VERSION }}
      # The 188 test binaries share most of their code, which zstd finds with a long
      # window: the archive shrinks from 2.2 GB to about 1.4 GB, which the five test jobs
      # download. nextest reads windows up to 128 MB (--long=27). The server's build script
      # writes a placeholder ui/build, which debug builds read from disk at run time, so the
      # shards get it next to the archive.
      - name: Build the test archive
        run: |
          mkdir -p "$RUNNER_TEMP/archive"
          cargo nextest archive --locked --workspace --zstd-level -7 --archive-file "$RUNNER_TEMP/raw.tar.zst"
          zstd -q -d -c "$RUNNER_TEMP/raw.tar.zst" | zstd -q -6 -T0 --long=27 -o "$RUNNER_TEMP/archive/tests.tar.zst"
          rm "$RUNNER_TEMP/raw.tar.zst"
          ls -l "$RUNNER_TEMP/archive/tests.tar.zst"
          tar -cf "$RUNNER_TEMP/archive/ui-build.tar" ui/build
      - uses: actions/upload-artifact@v4
        with:
          name: nextest-archive
          path: ${{ runner.temp }}/archive
          retention-days: 1
          # the archive is zstd already
          compression-level: 0
      - name: Doctests
        run: cargo test --locked --workspace --doc

  # Each shard runs a quarter of the tests from the archive. The settings come from
  # .config/nextest.toml: every failure reported at the end, and a test that runs past
  # ten minutes stopped. The suite includes openapi::tests::checked_in_copy_is_current,
  # which fails when docs/openapi.json is out of date.
  #
  # The tests of the `timing` group in .config/nextest.toml need the machine to
  # themselves, and one of them runs for about four minutes on a runner, which would
  # stall the shard it fell into. They run in a job of their own instead.
  test:
    name: Test (${{ matrix.shard }})
    needs: build
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1/4, 2/4, 3/4, 4/4, timing]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@${{ env.NEXTEST_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          name: nextest-archive
          path: ${{ runner.temp }}
      # shallow sparse checkouts of Apache Jena's and Oxigraph's test directories, about
      # 35 MB, which take a few seconds
      - name: Fetch the conformance suites
        run: scripts/fetch-test-suites.sh "$RUNNER_TEMP/test-suites" >> "$GITHUB_ENV"
      # cargo-nextest is called directly: the archive needs no Cargo, and calling cargo
      # would make rustup install the pinned toolchain first. The archive is extracted
      # into the checkout, where the build job's target directory was, because tests find
      # the server binary and the UI by paths fixed at compile time.
      - name: cargo nextest
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          tar -xf "$RUNNER_TEMP/ui-build.tar"
          timing='test(planning_at_the_limit_stops_at_the_timeout)'
          if [ "$SHARD" = timing ]; then
            select=(-E "$timing")
          else
            select=(-E "not $timing" --partition "slice:$SHARD")
          fi
          cargo-nextest nextest run --archive-file "$RUNNER_TEMP/tests.tar.zst" \
            --workspace-remap . --extract-to . --profile ci "${select[@]}"
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ matrix.shard == 'timing' && 'timing' || strategy.job-index }}
          path: target/nextest/ci/junit.xml
          retention-days: 7
          if-no-files-found: ignore

  # Apache Jena's own HTTP clients (RDFConnectionRemote, RDFConnectionFuseki, GSP, DSP,
  # QueryExecHTTP, UpdateExecHTTP) and Fuseki admin calls against the server binary that
  # the test archive carries (mise run test:jena-clients).
  jena-clients:
    name: Jena clients
    needs: build
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    env:
      JENA_VERSION: "6.2.0"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: nextest-archive
          path: ${{ runner.temp }}
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "21" }
      - uses: actions/cache@v4
        id: jena
        with:
          path: ${{ runner.temp }}/apache-jena-${{ env.JENA_VERSION }}
          key: apache-jena-${{ env.JENA_VERSION }}
      - name: Download Apache Jena
        if: steps.jena.outputs.cache-hit != 'true'
        run: curl -fsSL "https://archive.apache.org/dist/jena/binaries/apache-jena-$JENA_VERSION.tar.gz" | tar -xz -C "$RUNNER_TEMP"
      - name: Run Jena's clients against the server
        run: |
          tar -xf "$RUNNER_TEMP/tests.tar.zst" -C "$RUNNER_TEMP" --zstd target/debug/sparkles
          SPARKLES_BIN="$RUNNER_TEMP/target/debug/sparkles" \
          JENA_HOME="$RUNNER_TEMP/apache-jena-$JENA_VERSION" \
          JAVA="$(command -v java)" \
            scripts/test-jena-clients.sh

  # Linux arm64 and macOS on Apple silicon, for a manual run with all-platforms checked:
  # one job per platform that builds and runs the tests, with the conformance suites.
  other-platforms:
    name: Test (${{ matrix.platform }})
    if: inputs.all-platforms
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        platform: [linux-arm64, macos-arm64]
    runs-on: ${{ matrix.platform == 'macos-arm64' && 'macos-15' || 'ubuntu-24.04-arm' }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: tests-${{ matrix.platform }}
          swap: "true"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@${{ env.NEXTEST_VERSION }}
      - name: Fetch the conformance suites
        run: scripts/fetch-test-suites.sh "$RUNNER_TEMP/test-suites" >> "$GITHUB_ENV"
      - name: cargo nextest
        run: cargo nextest run --locked --workspace --profile ci
      - name: Doctests
        if: ${{ !cancelled() }}
        run: cargo test --locked --workspace --doc
