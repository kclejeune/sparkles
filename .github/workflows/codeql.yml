name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '25 4 * * 2'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [actions, c-cpp, javascript-typescript, python, rust]

    steps:
      - uses: actions/checkout@v5
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config: |
            # This Rust telemetry metric exceeded the six-hour hosted job limit.
            # Keep the default security query suite for every language.
            query-filters:
              - exclude:
                  id: rust/summary/summary-statistics
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
