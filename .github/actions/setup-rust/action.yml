# The Rust setup that every job building Rust shares: the toolchain, components and
# targets that rust-toolchain.toml pins, optional swap, and Swatinem/rust-cache for
# Cargo's registry and the dependencies' build artifacts. No RUSTFLAGS are added, as in
# local builds. setup-rust-toolchain sets CARGO_PROFILE_DEV_DEBUG=0, so CI builds carry no
# debug information, which shortens linking and lowers memory use.
#
# Caches are saved only from pushes to main. GitHub keeps 10 GB of caches per repository
# and evicts the least recently used entries beyond that, so caches saved by other refs
# would push out main's, which every branch and pull request can restore.
name: Set up Rust
description: Install the pinned Rust toolchain and restore the Cargo cache
inputs:
  cache-key:
    description: >-
      The cache's name. Jobs that build the same things can share one; others need their
      own, so that they do not replace each other's caches.
    required: true
  workspaces:
    description: rust-cache workspaces, as `path -> target` lines
    default: ". -> target"
  swap:
    description: Add 16 GB of swap on Linux, for builds whose peak exceeds the runner's memory
    default: "false"
runs:
  using: composite
  steps:
    - uses: actions-rust-lang/setup-rust-toolchain@v1
      with: { cache: false, rustflags: "" }
    # rust-cache keys its entries on every installed toolchain, and the runner images in
    # rotation preinstall different stable releases, which made the same job miss its own
    # cache from one run to the next. Only the pinned toolchain stays.
    - name: Remove the runner's other Rust toolchains
      shell: bash
      run: |
        active=$(rustup show active-toolchain | cut -d' ' -f1)
        rustup toolchain list | cut -d' ' -f1 | grep -vx "$active" | xargs -r -n1 rustup toolchain uninstall
        rustup toolchain list
    # A test build without a warm cache compiles the sparkles crate's library and its test
    # harness at once, two rustc processes of about 8 GB each, which is more than the
    # runner's 16 GB. Running out of memory ends the job with only "The runner has
    # received a shutdown signal", so such jobs add swap to get through that peak.
    - name: Add swap
      if: inputs.swap == 'true' && runner.os == 'Linux'
      shell: bash
      run: |
        sudo fallocate -l 16G /swapfile-ci
        sudo chmod 600 /swapfile-ci
        sudo mkswap /swapfile-ci > /dev/null
        sudo swapon /swapfile-ci
    - uses: Swatinem/rust-cache@v2
      with:
        shared-key: ${{ inputs.cache-key }}
        workspaces: ${{ inputs.workspaces }}
        save-if: ${{ github.ref == 'refs/heads/main' }}
        # a failed run saves the cache too, so one cold build does not make every later
        # run cold as well
        cache-on-failure: true
