{{- if and .Values.auth.enabled (eq (include "sparkles.authSource" .) "inline") }}
# The inline auth configuration. It may hold password and token hashes, so it is a
# Secret and never part of the ConfigMap.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sparkles.fullname" . }}-auth
  labels:
    {{- include "sparkles.labels" . | nindent 4 }}
type: Opaque
data:
  {{ .Values.auth.key }}: {{ .Values.auth.config | b64enc }}
{{- end }}
{{- if and .Values.backup.enabled (eq (include "sparkles.backupSource" .) "inline") }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sparkles.fullname" . }}-backup
  labels:
    {{- include "sparkles.labels" . | nindent 4 }}
type: Opaque
data:
  {{ .Values.backup.key }}: {{ .Values.backup.config | b64enc }}
{{- end }}
