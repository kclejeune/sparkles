[workspace]
resolver = "3"
members = ["crates/*"]
# crates/sparkles-py is its own workspace (it builds a Python extension; see its Cargo.toml)
exclude = ["vendor", "crates/sparkles-py"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/kclejeune/sparkles"

[workspace.dependencies]
sparkles = { path = "crates/sparkles" }
sparkles-reasoner = { path = "crates/sparkles-reasoner" }
sparkles-shacl = { path = "crates/sparkles-shacl" }
sparkles-shex = { path = "crates/sparkles-shex" }
sparkles-backup = { path = "crates/sparkles-backup" }
sparkles-fmt = { path = "crates/sparkles-fmt" }
sparkles-client = { path = "crates/sparkles-client", default-features = false }
oxrdf = { version = "0.3", features = ["rdfc-10", "rdf-12"] }
oxrdfio = { version = "0.2", features = ["rdf-12"] }
oxttl = { version = "0.2", features = ["rdf-12"] }
oxiri = "0.2"
spargebra = { version = "0.4", features = ["sparql-12", "sep-0006"] }
sparesults = { version = "0.3", features = ["sparql-12"] }
oxsdatatypes = "0.2"
oxilangtag = "0.1"
imbl = "7"
arc-swap = "1"
parking_lot = "0.12"
rustc-hash = "2"
smallvec = "1"
memmap2 = "0.9"
lz4_flex = "0.14"
rayon = "1.12"
regex = "1"
memchr = "2"
# stack segments for planning and evaluating deeply nested queries
stacker = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tempfile = "3"
md-5 = "0.11"
sha1 = "0.11"
sha2 = "0.11"
uuid = { version = "1", features = ["v4", "serde"] }
rand = "0.10"
percent-encoding = "2"
# CSV and TSV imports (sparkles::tabular)
csv = "1"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["multipart"] }
tower-http = { version = "0.7", features = ["cors", "compression-full", "decompression-full", "trace"] }
clap = { version = "4", features = ["derive"] }
rust-embed = { version = "8", features = ["interpolate-folder-path"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls", "form"] }
flate2 = "1"
zstd = { version = "0.14", features = ["zstdmt"] }
brotli = "8"
chrono = "0.4"
# backup repositories (crates/sparkles-backup)
object_store = { version = "0.14.2", default-features = false }
croner = "4"
chrono-tz = "0.10"
futures = "0.3"
bytes = "1"
async-trait = "0.1"
# the formatter (crates/sparkles-fmt, `sparkles fmt`)
unicode-width = "0.2"
ignore = "0.4"
similar = "2"
proptest = "1"
toml = "1"
# the formatter's JSON-LD reader and check, and its tests' JSON-LD datasets
json-event-parser = "0.2"
oxjsonld = { version = "0.2", features = ["rdf-12"] }
# `sparkles lsp`: the language server scaffold and protocol types of rust-analyzer
lsp-server = "0.10"
lsp-types = "0.97"
# the formatter built for the browser (crates/sparkles-fmt-wasm)
wasm-bindgen = "0.2"
# GeoSPARQL (feature `geo` of crates/sparkles); the `geo` crate is renamed so it does not
# clash with the `sparkles::geo` module
georust = { package = "geo", version = "0.33", default-features = false }
geo-index = { version = "0.4", default-features = false }
geographiclib-rs = "0.2"

[profile.release]
lto = "thin"
codegen-units = 4
debug = 1

[profile.dev.package."*"]
opt-level = 2

# spargebra 0.4.7 with left-associative `+ -` and `* /` (see vendor/spargebra/PATCHED.md)
[patch.crates-io]
spargebra = { path = "vendor/spargebra" }
